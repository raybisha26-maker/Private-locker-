<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MOtki 🫀 Ghaltu 💕</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 15% 15%,#ff4f9a55,transparent 30%),
        radial-gradient(circle at 85% 20%,#ff174455,transparent 28%),
        radial-gradient(circle at 50% 90%,#a000ff55,transparent 35%),
        linear-gradient(145deg,#16000e,#35001f,#09000d);
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ROMANTIC WALLPAPER */

.love-bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.love-bg span{
    position:absolute;
    font-size:30px;
    opacity:.22;
    animation:loveFloat linear infinite;
}

.love-bg span:nth-child(1){
    left:5%;
    animation-duration:10s;
}

.love-bg span:nth-child(2){
    left:18%;
    animation-duration:13s;
    animation-delay:2s;
}

.love-bg span:nth-child(3){
    left:32%;
    animation-duration:11s;
    animation-delay:4s;
}

.love-bg span:nth-child(4){
    left:48%;
    animation-duration:15s;
    animation-delay:1s;
}

.love-bg span:nth-child(5){
    left:64%;
    animation-duration:12s;
    animation-delay:5s;
}

.love-bg span:nth-child(6){
    left:78%;
    animation-duration:14s;
    animation-delay:3s;
}

.love-bg span:nth-child(7){
    left:91%;
    animation-duration:10s;
    animation-delay:6s;
}

@keyframes loveFloat{
    0%{
        transform:translateY(110vh) rotate(0deg) scale(.7);
    }

    50%{
        transform:translateY(45vh) rotate(180deg) scale(1);
    }

    100%{
        transform:translateY(-120px) rotate(360deg) scale(.8);
    }
}

/* MAIN */

.wrap{
    max-width:480px;
    margin:auto;
    padding:22px 18px 40px;
}

.title{
    text-align:center;
    font-size:29px;
    font-weight:bold;
    margin:12px 0;
    user-select:none;

    text-shadow:
        0 0 10px #ff4f9a,
        0 0 25px #ff1744;
}

.subtitle{
    text-align:center;
    opacity:.8;
    margin-bottom:24px;
}

/* CARD */

.card{
    background:#ffffff12;
    border:1px solid #ffffff25;
    border-radius:24px;
    padding:20px;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    box-shadow:
        0 10px 40px #00000055,
        inset 0 0 20px #ffffff05;
}

/* LOGIN */

.love-line{
    text-align:center;
    font-size:24px;
    letter-spacing:5px;
    margin:8px 0 18px;
}

input,
button{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:0;
    border-radius:14px;
}

input{
    background:#ffffff14;
    color:white;
    border:1px solid #ffffff30;
    outline:none;
}

input:focus{
    border-color:#ff5b9d;
    box-shadow:0 0 12px #ff2f7d55;
}

input::placeholder{
    color:#ffffff90;
}

button{
    background:linear-gradient(135deg,#fff,#ffd6e8);
    color:#280014;
    font-weight:bold;

    box-shadow:0 5px 18px #ff3d8d33;
    transition:.2s;
}

button:active{
    transform:scale(.97);
}

.status{
    text-align:center;
    min-height:20px;
    margin:10px 0;
}

/* TOPBAR */

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.topbar .title{
    flex:1;
}

.menu{
    width:46px;
    padding:8px;
    background:#ffffff18;
    color:white;
    font-size:25px;
    box-shadow:none;
}

/* GALLERY */

.gallery{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:20px;
}

.photo{
    background:#ffffff10;
    border:1px solid #ffffff22;
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 8px 25px #00000040;
}

.photo img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.photo-buttons{
    display:flex;
    gap:5px;
    padding:7px;
}

.photo-buttons button{
    margin:0;
    padding:10px 4px;
    font-size:12px;
}

.download{
    background:#9b4dff;
    color:white;
}

.delete{
    background:#ff3d67;
    color:white;
}

/* LOVE MESSAGE */

.love-message{
    text-align:center;
    margin:22px 0 5px;
    font-size:14px;
    opacity:.75;
}

.love-message b{
    color:#ff83b8;
}

/* OWNER */

.owner-badge{
    text-align:center;
    font-size:40px;
    margin-bottom:5px;
}

.owner-info{
    text-align:center;
    opacity:.7;
    font-size:13px;
    margin-bottom:15px;
}

/* MOBILE */

@media(max-width:380px){
    .title{
        font-size:25px;
    }

    .gallery{
        gap:9px;
    }
}
</style>
</head>
