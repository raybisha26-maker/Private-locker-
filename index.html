<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOtki 🫀 Ghaltu</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;
  background:
  radial-gradient(circle at 15% 15%,#9b35ff55,transparent 30%),
  radial-gradient(circle at 85% 85%,#ff3d9d55,transparent 30%),
  linear-gradient(145deg,#100018,#26002f,#08000d);
}
button,input{font:inherit}
.hidden{display:none!important}
.wrap{max-width:480px;margin:auto;padding:25px 18px}
.title{text-align:center;font-size:30px;font-weight:bold;margin:12px 0}
.subtitle{text-align:center;opacity:.7;margin-bottom:25px}
.card{
  background:#ffffff10;border:1px solid #ffffff20;border-radius:20px;
  padding:20px;backdrop-filter:blur(12px)
}
input,button{
  width:100%;padding:14px;margin:7px 0;border:0;border-radius:13px;
  font-size:15px
}
input{background:#ffffff12;color:white;border:1px solid #ffffff25}
input::placeholder{color:#ffffff80}
button{background:white;color:#160020;font-weight:bold;cursor:pointer}
.status{text-align:center;min-height:20px;margin:10px 0}
.topbar{display:flex;justify-content:space-between;align-items:center}
.menu{width:45px;background:#ffffff15;color:white;font-size:25px}
.gallery{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px
}
.photo{
  background:#ffffff10;border:1px solid #ffffff20;border-radius:15px;
  overflow:hidden
}
.photo img{
  width:100%;display:block;aspect-ratio:1/1;object-fit:cover
}
.photo-buttons{display:flex;gap:5px;padding:7px}
.photo-buttons button{margin:0;padding:10px 5px}
.download{background:#8d4dff;color:white}
.delete{background:#ff3d67;color:white}
.hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;opacity:.13;z-index:-1}
.hearts span{position:absolute;font-size:35px;animation:float 9s linear infinite}
.hearts span:nth-child(1){left:5%}
.hearts span:nth-child(2){left:25%;animation-delay:2s}
.hearts span:nth-child(3){left:50%;animation-delay:4s}
.hearts span:nth-child(4){left:72%;animation-delay:1s}
.hearts span:nth-child(5){left:90%;animation-delay:3s}
@keyframes float{
  from{transform:translateY(110vh)}
  to{transform:translateY(-100px) rotate(360deg)}
}
</style>
</head>

<body>

<div class="hearts">
<span>🫀</span><span>😘</span><span>💋</span>
<span>🫀</span><span>😘</span>
</div>

<div id="app" class="wrap">

  <div id="loginScreen" class="card">
    <div class="title" id="secretTitle">MOtki 🫀 Ghaltu</div>
    <div class="subtitle">Private Album</div>

    <input id="password" type="password" placeholder="Enter password">
    <button onclick="userLogin()">Open Album</button>

    <div id="status" class="status"></div>
  </div>

  <div id="albumScreen" class="hidden">
    <div class="topbar">
      <div class="title">MOtki 🫀 Ghaltu</div>
      <button class="menu" onclick="lockAlbum()">⋮</button>
    </div>

    <div id="gallery" class="gallery"></div>
  </div>

  <div id="ownerScreen" class="hidden card">
    <div class="title">👑 Owner</div>

    <input id="ownerEmail" type="email"
           placeholder="Owner email">
    <input id="ownerPassword" type="password"
           placeholder="Owner password">

    <button onclick="ownerLogin()">Owner Login</button>
    <button onclick="backToLogin()">Back</button>

    <div id="ownerStatus" class="status"></div>
  </div>

  <div id="ownerPanel" class="hidden">
    <div class="topbar">
      <div class="title">👑 Owner Panel</div>
      <button class="menu" onclick="lockAlbum()">⋮</button>
    </div>

    <div class="card">
      <input id="fileInput" type="file" accept="image/*">
      <button onclick="uploadPhoto()">Upload Photo</button>
      <div id="uploadStatus" class="status"></div>
    </div>

    <div id="ownerGallery" class="gallery"></div>
  </div>

</div>

<script>
const SUPABASE_URL = "https://dytkmhisobvhyzzqsbjj.supabase.co";
const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";
const BUCKET = "MOtki Ghaltu";

const OWNER_EMAIL = "bishalff211@gmail.com";
const USER_PASSWORD = "sabbis26";

let ownerMode = false;
let tapCount = 0;
let tapTimer = null;

const $ = id => document.getElementById(id);

function setStatus(id,msg){
  $(id).textContent = msg;
}

function headers(){
  return {
    "apikey": SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY
  };
}

/* USER LOGIN */
function userLogin(){
  const pass=$("password").value;

  if(pass === USER_PASSWORD){
    $("loginScreen").classList.add("hidden");
    $("albumScreen").classList.remove("hidden");
    loadGallery();
  }else{
    setStatus("status","Wrong password");
  }
}

/* 3 TAP OWNER */
$("secretTitle").addEventListener("click",()=>{
  tapCount++;
  clearTimeout(tapTimer);

  tapTimer=setTimeout(()=>{
    tapCount=0;
  },800);

  if(tapCount===3){
    tapCount=0;
    $("loginScreen").classList.add("hidden");
    $("ownerScreen").classList.remove("hidden");
    $("password").value="";
  }
});

/* OWNER LOGIN */
async function ownerLogin(){
  const email=$("ownerEmail").value.trim();
  const pass=$("ownerPassword").value;

  if(email !== OWNER_EMAIL){
    setStatus("ownerStatus","Wrong owner email");
    return;
  }

  if(!pass){
    setStatus("ownerStatus","Enter owner password");
    return;
  }

  /*
    Owner authentication is checked through Supabase Auth.
  */
  try{
    const res=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY
      },
      body:JSON.stringify({
        email:email,
        password:pass
      })
    });

    const data=await res.json();

    if(!res.ok){
      setStatus("ownerStatus",data.error_description || "Login failed");
      return;
    }

    localStorage.setItem("owner_token",data.access_token);
    localStorage.setItem("owner_refresh",data.refresh_token);

    ownerMode=true;
    $("ownerScreen").classList.add("hidden");
    $("ownerPanel").classList.remove("hidden");

    loadOwnerGallery();

  }catch(e){
    setStatus("ownerStatus","Connection error");
  }
}

/* LOAD USER GALLERY */
async function loadGallery(){
  const res=await fetch(
    SUPABASE_URL+"/storage/v1/object/list/"+encodeURIComponent(BUCKET),
    {
      method:"POST",
      headers:{
        ...headers(),
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        prefix:"",
        limit:100,
        offset:0
      })
    }
  );

  if(!res.ok)return;

  const files=await res.json();
  renderGallery(files,"gallery",false);
}

/* LOAD OWNER GALLERY */
async function loadOwnerGallery(){
  const res=await fetch(
    SUPABASE_URL+"/storage/v1/object/list/"+encodeURIComponent(BUCKET),
    {
      method:"POST",
      headers:{
        ...headers(),
        "Content-Type":"application/json",
        "Authorization":"Bearer "+
          (localStorage.getItem("owner_token")||SUPABASE_KEY)
      },
      body:JSON.stringify({
        prefix:"",
        limit:100,
        offset:0
      })
    }
  );

  if(!res.ok)return;

  const files=await res.json();
  renderGallery(files,"ownerGallery",true);
}

/* RENDER */
function renderGallery(files,target,isOwner){
  const box=$(target);
  box.innerHTML="";

  files.filter(f=>f.name).forEach(file=>{
    const url=SUPABASE_URL+
      "/storage/v1/object/public/"+
      encodeURIComponent(BUCKET)+"/"+
      encodeURIComponent(file.name);

    const div=document.createElement("div");
    div.className="photo";

    div.innerHTML=`
      <img src="${url}" loading="lazy">
      <div class="photo-buttons">
        <button class="download"
          onclick="downloadPhoto('${url}','${escapeName(file.name)}')">
          Download
        </button>
        ${isOwner ? `
        <button class="delete"
          onclick="deletePhoto('${escapeName(file.name)}')">
          Delete
        </button>` : ""}
      </div>
    `;

    box.appendChild(div);
  });
}

function escapeName(name){
  return name.replace(/'/g,"\\'");
}

/* DOWNLOAD */
async function downloadPhoto(url,name){
  try{
    const res=await fetch(url);
    const blob=await res.blob();

    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){
    window.open(url,"_blank");
  }
}

/* UPLOAD */
async function uploadPhoto(){
  const file=$("fileInput").files[0];

  if(!file){
    setStatus("uploadStatus","Choose a photo first");
    return;
  }

  const token=localStorage.getItem("owner_token");

  if(!token){
    setStatus("uploadStatus","Owner login required");
    return;
  }

  const filename=Date.now()+"_"+file.name.replace(/\s+/g,"_");

  const res=await fetch(
    SUPABASE_URL+"/storage/v1/object/"+
    encodeURIComponent(BUCKET)+"/"+encodeURIComponent(filename),
    {
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+token,
        "Content-Type":file.type || "application/octet-stream"
      },
      body:file
    }
  );

  if(res.ok){
    setStatus("uploadStatus","Uploaded successfully");
    $("fileInput").value="";
    loadOwnerGallery();
  }else{
    const data=await res.json().catch(()=>({}));
    setStatus("uploadStatus",data.message||"Upload failed");
  }
}

/* DELETE */
async function deletePhoto(name){
  if(!confirm("Delete this photo?"))return;

  const token=localStorage.getItem("owner_token");

  const res=await fetch(
    SUPABASE_URL+"/storage/v1/object/"+
    encodeURIComponent(BUCKET),
    {
      method:"DELETE",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+token,
        "Content-Type":"application/json"
      },
      body:JSON.stringify([name])
    }
  );

  if(res.ok){
    loadOwnerGallery();
  }else{
    alert("Delete failed");
  }
}

/* LOCK */
function lockAlbum(){
  ownerMode=false;

  $("albumScreen").classList.add("hidden");
  $("ownerPanel").classList.add("hidden");
  $("ownerScreen").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");

  $("password").value="";
  $("ownerPassword").value="";
}

/* BACK */
function backToLogin(){
  $("ownerScreen").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
}
</script>

</body>
</html>
