<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOtki ❤️ Birthday</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Georgia,serif;
  background:#080308;
}

body{
  color:white;
}

.scene{
  position:fixed;
  inset:0;
  display:none;
  overflow:hidden;
}

.scene.active{
  display:block;
}

/* ================= COUNTDOWN ================= */

#countdown{
  background:
    radial-gradient(circle at 50% 35%,#4d1745 0%,#21091e 38%,#080308 100%);
  text-align:center;
}

.intro{
  position:absolute;
  top:15%;
  width:100%;
  padding:20px;
  animation:introIn 1.6s ease both;
}

.small-title{
  color:#eebbd9;
  letter-spacing:6px;
  font-size:13px;
  margin-bottom:35px;
}

.intro h1{
  font-size:clamp(42px,12vw,76px);
  font-style:italic;
  line-height:1.05;
  text-shadow:0 0 30px rgba(255,170,220,.35);
}

.intro p{
  margin-top:25px;
  color:#efc7dc;
  font-size:18px;
}

.count{
  position:absolute;
  bottom:17%;
  left:5%;
  width:90%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.box{
  border:1px solid rgba(255,220,240,.3);
  background:rgba(255,255,255,.07);
  border-radius:20px;
  padding:18px 4px;
  backdrop-filter:blur(8px);
}

.box b{
  display:block;
  font-size:30px;
}

.box span{
  font-size:10px;
  letter-spacing:3px;
  color:#dcb9d0;
}

.start-btn{
  position:absolute;
  bottom:7%;
  left:50%;
  transform:translateX(-50%);
  padding:12px 28px;
  border:1px solid #e8a9d0;
  border-radius:30px;
