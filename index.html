<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MOtki 💗</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#050007;
  color:white;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

button{
  border:0;
  cursor:pointer;
}

/* INTRO */

#intro{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
  radial-gradient(circle,#52002f,#16000e 50%,#030003);
  transition:1s;
}

.introHeart{
  font-size:90px;
  animation:heartbeat 1s infinite;
  filter:drop-shadow(0 0 25px #ff277c);
}

@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.2)}
}

.intro h1{
  font-size:45px;
  margin:20px 0;
}

.openBtn{
  padding:15px 32px;
  border-radius:40px;
  color:white;
  background:linear-gradient(90deg,#ff176f,#ff70ac);
  font-size:17px;
  box-shadow:0 0 30px #ff176f88;
}

/* MAIN */

#main{
  display:none;
}

.hero{
  height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
  background:
  radial-gradient(circle at 50% 30%,#600035,#16000e 45%,#030003);
}

.heroContent{
  position:relative;
  z-index:10;
}

.hero h1{
  font-size:65px;
  color:#ff65a4;
  text-shadow:0 0 25px #ff2277;
}

.hero h2{
  margin-top:12px;
  font-size:27px;
}

.hero p{
  margin-top:20px;
  color:#ddd;
}

/* FLOAT HEARTS */

.floatHeart{
  position:absolute;
  bottom:-60px;
  pointer-events:none;
  animation:floatUp linear forwards;
  z-index:2;
}

@keyframes floatUp{
  from{
    transform:translateY(0) rotate(0);
    opacity:0;
  }
  15%{opacity:1}
  to{
    transform:translateY(-115vh) rotate(360deg);
    opacity:0;
  }
}

/* COMMON */

section{
  min-height:100vh;
  padding:80px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.title{
  font-size:38px;
  color:#ff62a3;
  text-align:center;
  text-shadow:0 0 20px #ff1972;
}

/* PHOTOS */

.photoArea{
  width:100%;
  max-width:850px;
}

.photoGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:40px;
}

.photo{
  border-radius:25px;
  overflow:hidden;
  border:2px solid #ff4d9244;
  box-shadow:0 0 35px #ff146622;
  background:#16000d;
}

.photo img{
  width:100%;
  height:450px;
  object-fit:cover;
  display:block;
}

@media(max-width:650px){
  .photoGrid{
    grid-template-columns:1fr;
  }

  .photo img{
    height:430px;
  }

  .hero h1{
    font-size:48px;
  }
}

/* BALLOON GAME */

#balloonSection{
  flex-direction:column;
  background:
  radial-gradient(circle at center,#30001e,#070007 65%);
}

.gameText{
  margin-top:15px;
  color:#aaa;
  text-align:center;
}

.balloonBox{
  width:100%;
  max-width:700px;
  height:600px;
  position:relative;
  margin-top:20px;
  border-radius:30px;
  overflow:hidden;
}

.balloon{
  position:absolute;
  font-size:65px;
  cursor:pointer;
  user-select:none;
  animation:balloonFloat 3s ease-in-out infinite;
  filter:drop-shadow(0 0 12px #ff3e87);
}

@keyframes balloonFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-20px)}
}

.pop{
  animation:pop .35s forwards!important;
}

@keyframes pop{
  0%{transform:scale(1)}
  100%{
    transform:scale(2);
    opacity:0;
  }
}

.popHeart{
  position:absolute;
  font-size:30px;
  animation:popHeart 1s forwards;
  pointer-events:none;
}

@keyframes popHeart{
  from{
    transform:scale(.2);
    opacity:1;
  }
  to{
    transform:translateY(-100px) scale(1.5);
    opacity:0;
  }
}

/* ARROW */

#arrowSection{
  flex-direction:column;
  background:#020002;
}

.targetArea{
  width:100%;
  max-width:800px;
  height:500px;
  position:relative;
  margin-top:25px;
  border-radius:30px;
  overflow:hidden;
  background:
  radial-gradient(circle at center,#210018,#030003 70%);
}

.targetHeart{
  position:absolute;
  font-size:80px;
  left:75%;
  top:42%;
  filter:drop-shadow(0 0 20px #ff297d);
}

.arrow{
  position:absolute;
  left:-120px;
  top:46%;
  font-size:75px;
  transform:rotate(0deg);
  z-index:20;
  transition:2s cubic-bezier(.1,.7,.1,1);
}

.shootBtn{
  margin-top:25px;
  padding:14px 30px;
  border-radius:30px;
  background:#ff287d;
  color:white;
  font-size:17px;
  box-shadow:0 0 25px #ff287d99;
}

/* TREE */

#treeSection{
  flex-direction:column;
  background:
  linear-gradient(#030003,#13000d);
}

.treeScene{
  width:100%;
  max-width:700px;
  height:650px;
  position:relative;
  margin-top:20px;
  overflow:hidden;
}

.ground{
  position:absolute;
  bottom:40px;
  left:10%;
  width:80%;
  height:8px;
  background:#4b1730;
  border-radius:50%;
}

.trunk{
  position:absolute;
  bottom:45px;
  left:50%;
  width:25px;
  height:0;
  transform:translateX(-50%);
  background:#623621;
  border-radius:20px;
  transition:3s;
}

.branch{
  position:absolute;
  height:14px;
  background:#623621;
  border-radius:20px;
  transform-origin:left center;
  opacity:0;
  transition:2s;
}

.branch1{
  width:180px;
  left:50%;
  bottom:300px;
  transform:rotate(-35deg);
}

.branch2{
  width:170px;
  left:49%;
  bottom:380px;
  transform:rotate(35deg);
}

.branch3{
  width:150px;
  left:50%;
  bottom:450px;
  transform:rotate(-25deg);
}

.treeHeart{
  position:absolute;
  opacity:0;
  transform:scale(0);
  transition:1.2s;
  font-size:35px;
  filter:drop-shadow(0 0 12px #ff277b);
}

.tree1{left:20%;top:28%}
.tree2{left:38%;top:17%}
.tree3{left:60%;top:22%}
.tree4{left:72%;top:35%}
.tree5{left:28%;top:40%}
.tree6{left:50%;top:35%}
.tree7{left:43%;top:8%}
.tree8{left:78%;top:18%}
.tree9{left:15%;top:22%}

.grow{
  height:520px;
}

.showBranch{
  opacity:1;
}

.showHeart{
  opacity:1;
  transform:scale(1);
}

/* CAKE */

#cakeSection{
  flex-direction:column;
  background:
  radial-gradient(circle,#39001f,#050005 65%);
}

.cake{
  width:280px;
  height:230px;
  position:relative;
  margin-top:60px;
}

.cakeBase{
  position:absolute;
  bottom:20px;
  width:280px;
  height:120px;
  border-radius:15px 15px 25px 25px;
  background:linear-gradient(#ff71a9,#c92265);
  box-shadow:0 0 30px #ff267b66;
}

.cream{
  position:absolute;
  top:80px;
  width:280px;
  height:45px;
  background:#fff2f8;
  border-radius:50%;
}

.cream:after{
  content:"";
  position:absolute;
  left:25px;
  right:25px;
  bottom:-18px;
  height:35px;
  background:#fff2f8;
  border-radius:50%;
}

.candle{
  position:absolute;
  width:18px;
  height:70px;
  top:10px;
  background:#ffd5e5;
  left:131px;
  border-radius:5px;
}

.flame{
  position:absolute;
  width:25px;
  height:35px;
  background:#ffd84d;
  border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);
  top:-28px;
  left:-3px;
  box-shadow:0 0 25px #ffd52d;
  animation:flame 1s infinite alternate;
}

@keyframes flame{
  from{transform:rotate(-45deg) scale(.9)}
  to{transform:rotate(-45deg) scale(1.1)}
}

.cut{
  animation:cakeCut 1.2s forwards;
}

@keyframes cakeCut{
  to{
    transform:rotate(3deg) scale(.96);
  }
}

.cakeBtn{
  margin-top:25px;
  padding:15px 35px;
  border-radius:30px;
  background:#ff397f;
  color:white;
  font-size:17px;
  box-shadow:0 0 30px #ff397f99;
}

/* SURPRISE */

#finalSection{
  flex-direction:column;
  text-align:center;
  background:
  radial-gradient(circle,#420022,#050005 70%);
}

.bigHeart{
  font-size:120px;
  animation:heartbeat 1.2s infinite;
  filter:drop-shadow(0 0 30px #ff1e79);
}

.finalName{
  font-size:55px;
  color:#ff68a7;
  margin-top:20px;
  text-shadow:0 0 30px #ff247d;
}

.finalBtn{
  margin-top:35px;
  padding:16px 35px;
  border-radius:40px;
  color:white;
  background:linear-gradient(90deg,#ff176f,#ff71ac);
  font-size:18px;
}

/* FIREWORK CANVAS */

#fireworks{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:99990;
}
</style>
</head>

<body>

<!-- INTRO -->

<div id="intro">

  <div>

    <div class="introHeart">💗</div>

    <h1>MOtki</h1>

    <button class="openBtn" onclick="openSite()">
      Open 💗
    </button>

  </div>

</div>


<main id="main">

<!-- HERO -->

<section class="hero">

  <div class="heroContent">

    <div style="font-size:70px">🎂</div>

    <h1>MOtki 💗</h1>

    <h2>Birthday Surprise</h2>

    <p>Made specially for MOtki ✨</p>

  </div>

</section>


<!-- PHOTOS -->

<section>

  <div class="photoArea">

    <h2 class="title">MOtki 💗</h2>

    <div class="photoGrid">

      <div class="photo">
        <img src="IMG_20250827_184410.jpg">
      </div>

      <div class="photo">
        <img src="ChatGPT Image Jun 15, 2025, 02_27_03 PM.png">
      </div>

    </div>

  </div>

</section>


<!-- BALLOON POP -->

<section id="balloonSection">

  <h2 class="title">Pop them 🎈</h2>

  <p class="gameText">
    सबै balloon pop गर 💗
  </p>

  <div class="balloonBox" id="balloonBox">

    <div class="balloon" style="left:10%;top:15%" onclick="popBalloon(this)">🎈</div>
    <div class="balloon" style="left:40%;top:30%" onclick="popBalloon(this)">🎈</div>
    <div class="balloon" style="left:70%;top:12%" onclick="popBalloon(this)">🎈</div>
    <div class="balloon" style="left:25%;top:60%" onclick="popBalloon(this)">🎈</div>
    <div class="balloon" style="left:65%;top:65%" onclick="popBalloon(this)">🎈</div>
    <div class="balloon" style="left:45%;top:75%" onclick="popBalloon(this)">🎈</div>

  </div>

</section>


<!-- ARROW -->

<section id="arrowSection">

  <h2 class="title">🏹 💗</h2>

  <p class="gameText">
    Arrow चलाऊ 💗
  </p>

  <div class="targetArea" id="targetArea">

    <div class="targetHeart" id="targetHeart">
      ❤️
    </div>

    <div class="arrow" id="arrow">
      🏹
    </div>

  </div>

  <button class="shootBtn" onclick="shootArrow()">
    Shoot 🏹
  </button>

</section>


<!-- TREE -->

<section id="treeSection">

  <h2 class="title">🌳 → 💗</h2>

  <div class="treeScene">

    <div class="trunk" id="trunk"></div>

    <div class="branch branch1" id="b1"></div>
    <div class="branch branch2" id="b2"></div>
    <div class="branch branch3" id="b3"></div>

    <div class="treeHeart tree1">💗</div>
    <div class="treeHeart tree2">❤️</div>
    <div class="treeHeart tree3">💖</div>
    <div class="treeHeart tree4">💕</div>
    <div class="treeHeart tree5">💗</div>
    <div class="treeHeart tree6">❤️</div>
    <div class="treeHeart tree7">💖</div>
    <div class="treeHeart tree8">💕</div>
    <div class="treeHeart tree9">💗</div>

    <div class="ground"></div>

  </div>

  <button class="shootBtn" onclick="growTree()">
    Grow 💗
  </button>

</section>


<!-- CAKE -->

<section id="cakeSection">

  <h2 class="title">🎂 MOtki को Cake</h2>

  <div class="cake" id="cake">

    <div class="candle">

      <div class="flame" id="flame"></div>

    </div>

    <div class="cream"></div>

    <div class="cakeBase"></div>

  </div>

  <button class="cakeBtn" onclick="cutCake()">
    Cut Cake 🎂
  </button>

</section>


<!-- FINAL -->

<section id="finalSection">

  <div class="bigHeart">💗</div>

  <div class="finalName">
    MOtki
  </div>

  <button class="finalBtn" onclick="finalSurprise()">
    Last Surprise 🎁
  </button>

</section>

</main>


<canvas id="fireworks"></canvas>


<script>

/* INTRO */

function openSite(){

  document.getElementById("intro").style.opacity="0";

  setTimeout(()=>{

    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";

  },900);

}


/* FLOATING HEARTS */

function makeHeart(){

  if(
    document.getElementById("main").style.display==="none"
  ) return;

  const h=document.createElement("div");

  h.className="floatHeart";

  h.innerHTML=[
    "💗",
    "❤️",
    "💖",
    "💕",
    "💘",
    "✨"
  ][Math.floor(Math.random()*6)];

  h.style.left=Math.random()*100+"%";

  h.style.fontSize=
    (18+Math.random()*30)+"px";

  h.style.animationDuration=
    (5+Math.random()*5)+"s";

  document.body.appendChild(h);

  setTimeout(()=>{
    h.remove();
  },10000);

}

setInterval(makeHeart,500);


/* BALLOON POP */

function popBalloon(balloon){

  if(balloon.classList.contains("pop")) return;

  balloon.classList.add("pop");

  for(let i=0;i<7;i++){

    const heart=document.createElement("div");

    heart.className="popHeart";

    heart.innerHTML=[
      "💗",
      "💖",
      "💕",
      "✨"
    ][Math.floor(Math.random()*4)];

    heart.style.left=
      balloon.offsetLeft+
      Math.random()*50+"px";

    heart.style.top=
      balloon.offsetTop+
      Math.random()*40+"px";

    document.getElementById("balloonBox")
      .appendChild(heart);

    setTimeout(()=>{
      heart.remove();
    },1000);

  }

  setTimeout(()=>{
    balloon.style.display="none";
  },350);

}


/* ARROW */

let arrowUsed=false;

function shootArrow(){

  if(arrowUsed) return;

  arrowUsed=true;

  const arrow=document.getElementById("arrow");

  arrow.style.left="69%";

  setTimeout(()=>{

    document.getElementById("targetHeart")
      .animate(
        [
          {transform:"scale(1)"},
          {transform:"scale(1.8)"},
          {transform:"scale(1)"}
        ],
        {duration:600}
      );

    for(let i=0;i<20;i++){

      const p=document.createElement("div");

      p.innerHTML="💗";

      p.style.position="absolute";

      p.style.left="75%";
      p.style.top="42%";

      p.style.fontSize="20px";

      p.style.transition="1s";

      document.getElementById("targetArea")
        .appendChild(p);

      setTimeout(()=>{

        p.style.transform=
          `translate(${Math.random()*300-150}px,
          ${Math.random()*300-150}px)`;

        p.style.opacity="0";

      },20);

      setTimeout(()=>p.remove(),1100);

    }

  },2000);

}


/* TREE */

function growTree(){

  document.getElementById("trunk")
    .classList.add("grow");

  setTimeout(()=>{

    document.querySelectorAll(".branch")
      .forEach(b=>b.classList.add("showBranch"));

  },1200);

  setTimeout(()=>{

    document.querySelectorAll(".treeHeart")
      .forEach((h,i)=>{

        setTimeout(()=>{

          h.classList.add("showHeart");

        },i*180);

      });

  },2300);

}


/* CAKE */

function cutCake(){

  document.getElementById("flame").style.display="none";

  document.getElementById("cake")
    .classList.add("cut");

  for(let i=0;i<30;i++){

    const heart=document.createElement("div");

    heart.innerHTML="💗";

    heart.style.position="fixed";

    heart.style.left="50%";
    heart.style.top="55%";

    heart.style.fontSize=
      (15+Math.random()*25)+"px";

    heart.style.zIndex="9999";

    heart.style.transition="1.5s";

    document.body.appendChild(heart);

    setTimeout(()=>{

      heart.style.transform=
        `translate(${Math.random()*500-250}px,
        ${Math.random()*-400}px)`;

      heart.style.opacity="0";

    },20);

    setTimeout(()=>{
      heart.remove();
    },1600);

  }

}


/* FIREWORKS */

const canvas=document.getElementById("fireworks");

const ctx=canvas.getContext("2d");

let particles=[];

function resize(){

  canvas.width=innerWidth;
  canvas.height=innerHeight;

}

resize();

window.addEventListener("resize",resize);


function firework(x,y){

  for(let i=0;i<80;i++){

    const angle=
      Math.PI*2*i/80;

    const speed=
      2+Math.random()*6;

    particles.push({

      x:x,
      y:y,

      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,

      life:90

    });

  }

}


function animate(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  particles.forEach((p,i)=>{

    p.x+=p.vx;
    p.y+=p.vy;

    p.vy+=.04;

    p.life--;

    ctx.globalAlpha=p.life/90;

    ctx.fillStyle=[
      "#ff3b82",
      "#ffcf4a",
      "#ffffff",
      "#ff72bd"
    ][Math.floor(Math.random()*4)];

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      2.5,
      0,
      Math.PI*2
    );

    ctx.fill();

    if(p.life<=0)
      particles.splice(i,1);

  });

  ctx.globalAlpha=1;

  requestAnimationFrame(animate);

}

animate();


function finalSurprise(){

  for(let i=0;i<12;i++){

    setTimeout(()=>{

      firework(
        50+Math.random()*(innerWidth-100),
        100+Math.random()*(innerHeight*.55)
      );

    },i*350);

  }

  for(let i=0;i<50;i++){

    setTimeout(()=>{

      const h=document.createElement("div");

      h.innerHTML="💗";

      h.style.position="fixed";
      h.style.left=Math.random()*100+"%";
      h.style.bottom="-40px";
      h.style.fontSize=
        (20+Math.random()*35)+"px";

      h.style.zIndex="99999";
      h.style.transition="4s";

      document.body.appendChild(h);

      setTimeout(()=>{

        h.style.transform=
          "translateY(-110vh)";

        h.style.opacity="0";

      },50);

      setTimeout(()=>h.remove(),4200);

    },i*70);

  }

}

</script>

</body>
</html>
