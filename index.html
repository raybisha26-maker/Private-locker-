<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Motki ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #ff9ecb, #ffc4e1, #fff0f5);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
  }
  .start-screen, .birthday-screen {
    text-align: center;
    transition: all 0.8s ease;
  }
  .hint { color: #d6005c; font-size: 1.1em; margin-bottom: 15px; }
  
  .heart {
    width: 130px;
    height: 130px;
    background: #ff2e63;
    position: relative;
    transform: rotate(45deg);
    cursor: pointer;
    margin: 0 auto;
    animation: pulse 1.5s infinite;
    box-shadow: 0 0 40px rgba(255,46,99,0.7);
  }
  .heart:before, .heart:after {
    content: "";
    width: 130px;
    height: 130px;
    position: absolute;
    border-radius: 50%;
    background: #ff2e63;
  }
  .heart:before { top: -65px; left: 0; }
  .heart:after { left: -65px; top: 0; }
  @keyframes pulse { 0%,100%{transform:rotate(45deg) scale(1)} 50%{transform:rotate(45deg) scale(1.15)} }
  
  .pull-text { color: #d6005c; margin-top: 15px; font-weight: 600; }
  
  .birthday-screen { display: none; }
  .birthday-screen h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 4em;
    color: #d6005c;
    margin-bottom: 10px;
    animation: fadeIn 1s ease;
  }
  .birthday-screen p {
    font-size: 1.3em;
    color: #b3004d;
    margin-bottom: 20px;
    animation: fadeIn 1.5s ease;
  }
  .heart-tree {
    width: 250px;
    height: 250px;
    margin: 20px auto;
    position: relative;
    animation: grow 2s ease;
  }
  .heart-tree span {
    position: absolute;
    width: 30px;
    height: 30px;
    background: #ff4b7d;
    transform: rotate(45deg);
    border-radius: 5px;
  }
  .heart-tree span:before, .heart-tree span:after {
    content: ""; width: 30px; height: 30px; position: absolute; border-radius: 50%; background: #ff4b7d;
  }
  .heart-tree span:before { top: -15px; left: 0; }
  .heart-tree span:after { left: -15px; top: 0; }
  
  @keyframes fadeIn { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }
  @keyframes grow { from{transform:scale(0)} to{transform:scale(1)} }
  
  .confetti {
    position: absolute;
    width: 10px; height: 10px;
    top: -10px;
    animation: fall 3s linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="start-screen" id="start">
    <p class="hint">a little something for you</p>
    <div class="heart" onclick="showBirthday()"></div>
    <p class="pull-text">CLICK ME ❤️</p>
  </div>

  <div class="birthday-screen" id="birthday">
    <h1>Happy Birthday Motki!</h1>
    <p>Bhado 12 gate - timro din ❤️</p>
    <p>Sabnam, tim bina ma adhuro chhu. Timro smile nai mero duniya ho.</p>
    <div class="heart-tree" id="tree"></div>
    <p>- Love, [Timi ko naam]</p>
  </div>

<script>
function showBirthday() {
  document.getElementById('start').style.display = 'none';
  document.getElementById('birthday').style.display = 'block';
  createConfetti();
  createHeartTree();
}

function createConfetti() {
  for(let i=0; i<80; i++){
    let c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = ['#ff2e63','#ff85b3','#ffb3d1','#ffc4e1'][Math.floor(Math.random()*4)];
    c.style.animationDelay = Math.random()*0.5 + 's';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 3000);
  }
}

function createHeartTree() {
  let tree = document.getElementById('tree');
  for(let i=0; i<15; i++){
    let h = document.createElement('span');
    let x = Math.random()*200 + 25;
    let y = Math.random()*200 + 25;
    h.style.left = x + 'px';
    h.style.top = y + 'px';
    h.style.animationDelay = (i*0.1) + 's';
    tree.appendChild(h);
  }
}
</script>
</body>
</html>
