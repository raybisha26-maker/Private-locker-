<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Birthday Gift</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease, transform 1s ease;
        }

        .hide {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
        }

        /* Screen 1: Pull & Release */
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
            font-style: italic;
        }

        .heart-container {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,182,193,0.8) 0%, rgba(255,255,255,0) 70%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart {
            width: 50px;
            height: 50px;
            background-color: #ff4081;
            transform: rotate(-45deg);
            position: relative;
            animation: pulse 1.5s infinite;
        }

        .heart::before, .heart::after {
            content: '';
            width: 50px;
            height: 50px;
            background-color: #ff4081;
            border-radius: 50%;
            position: absolute;
        }

        .heart::before { top: -25px; left: 0; }
        .heart::after { left: 25px; top: 0; }

        @keyframes pulse {
            0%, 100% { transform: scale(1) rotate(-45deg); }
            50% { transform: scale(1.1) rotate(-45deg); }
        }

        .bow-arrow {
            margin-top: 60px;
            font-size: 32px;
            cursor: grab;
            user-select: none;
            transition: transform 0.1s ease;
        }

        .instruction {
            margin-top: 40px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #aaa;
        }

        /* Screen 2: Main Message */
        #message-screen {
            background-color: #d81b60;
            color: white;
        }

        .wish-title {
            font-size: 16px;
            opacity: 0.8;
            font-style: italic;
        }

        .main-title {
            font-size: 48px;
            font-weight: 700;
            margin: 10px 0;
        }

        .sub-text {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Screen 3: Tree Scene */
        .tree-container {
            position: relative;
            width: 150px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .trunk {
            width: 8px;
            height: 100px;
            background: #5d4037;
            position: absolute;
            bottom: 0;
            border-radius: 4px;
        }

        .heart-foliage {
            width: 120px;
            height: 120px;
            background-color: #ff80ab;
            transform: rotate(-45deg);
            position: absolute;
            top: 10px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.4);
        }

        .final-wish {
            text-align: center;
            margin-top: 20px;
            color: #ad1457;
        }

        .final-wish h2 {
            font-size: 28px;
        }

        .final-wish p {
            font-size: 14px;
            color: #888;
            font-style: italic;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Screen 1: Pull & Release Interactive Screen -->
    <div id="interactive-screen" class="screen">
        <p class="subtitle">a little something, for you</p>
        
        <div class="heart-container">
            <div class="heart"></div>
        </div>

        <div class="bow-arrow" id="drag-item">🏹</div>

        <p class="instruction">PULL & RELEASE</p>
    </div>

    <!-- Screen 2: Happy Birthday Message Screen -->
    <div id="message-screen" class="screen hide">
        <p class="wish-title">make a wish...</p>
        <h1 class="main-title">Happy Birthday</h1>
        <p class="sub-text">to someone worth celebrating</p>
    </div>

    <!-- Screen 3: Heart Tree Animation Screen -->
    <div id="tree-screen" class="screen hide">
        <p class="subtitle">and... make it count</p>
        <div class="tree-container">
            <div class="trunk"></div>
            <div class="heart-foliage"></div>
        </div>
        <div class="final-wish">
            <h2>Happy Birthday</h2>
            <p>here's to a year that blooms</p>
        </div>
    </div>

    <script>
        const dragItem = document.getElementById('drag-item');
        const screen1 = document.getElementById('interactive-screen');
        const screen2 = document.getElementById('message-screen');
        const screen3 = document.getElementById('tree-screen');

        let isDragging = false;
        let startY = 0;

        // Mouse & Touch events
        dragItem.addEventListener('mousedown', startDrag);
        dragItem.addEventListener('touchstart', startDrag);

        window.addEventListener('mousemove', onDrag);
        window.addEventListener('touchmove', onDrag);

        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function startDrag(e) {
            isDragging = true;
            startY = e.clientY || e.touches[0].clientY;
        }

        function onDrag(e) {
            if (!isDragging) return;
            let currentY = e.clientY || (e.touches ? e.touches[0].clientY : startY);
            let deltaY = currentY - startY;

            if (deltaY > 0) {
                dragItem.style.transform = `translateY(${deltaY}px)`;
            }
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            dragItem.style.transform = `translateY(0px)`;
            
            triggerSurpriseSequence();
        }

        function triggerSurpriseSequence() {
            // Step 1: Hide Screen 1 & Show Screen 2
            screen1.classList.add('hide');
            setTimeout(() => {
                screen2.classList.remove('hide');
            }, 500);

            // Step 2: Hide Screen 2 & Show Screen 3 (Tree Scene)
            setTimeout(() => {
                screen2.classList.add('hide');
                setTimeout(() => {
                    screen3.classList.remove('hide');
                }, 800);
            }, 3000);
        }
    </script>
</body>
</html>
