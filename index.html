<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MOtki 🫀 Ghaltu</title>

    <style>
        *{box-sizing:border-box}

        body{
            margin:0;
            min-height:100vh;
            font-family:Arial,sans-serif;
            color:#fff;
            background:
                radial-gradient(circle at 15% 15%,#9b35ff55,transparent 30%),
                radial-gradient(circle at 85% 85%,#ff3d9d55,transparent 30%),
                linear-gradient(145deg,#100018,#26002f,#08000d);
        }

        button,input{font:inherit}

        .hidden{display:none!important}

        .wrap{
            max-width:480px;
            margin:auto;
            padding:25px 18px;
        }

        .title{
            text-align:center;
            font-size:29px;
            font-weight:bold;
            margin:12px 0;
            user-select:none;
        }

        .subtitle{
            text-align:center;
            opacity:.7;
            margin-bottom:25px;
        }

        .card{
            background:#ffffff10;
            border:1px solid #ffffff20;
            border-radius:20px;
            padding:20px;
            backdrop-filter:blur(12px);
        }

        input,button{
            width:100%;
            padding:14px;
            margin:7px 0;
            border:0;
            border-radius:13px;
        }

        input{
            background:#ffffff12;
            color:white;
            border:1px solid #ffffff25;
        }

        input::placeholder{
            color:#ffffff80;
        }

        button{
            background:white;
            color:#160020;
            font-weight:bold;
            cursor:pointer;
        }

        .status{
            text-align:center;
            min-height:20px;
            margin:10px 0;
        }

        .topbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
        }

        .topbar .title{
            flex:1;
        }

        .menu{
            width:45px;
            padding:8px;
            background:#ffffff15;
            color:white;
            font-size:25px;
        }

        .gallery{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:12px;
            margin-top:20px;
        }

        .photo{
            background:#ffffff10;
            border:1px solid #ffffff20;
            border-radius:15px;
            overflow:hidden;
        }

        .photo img{
            width:100%;
            aspect-ratio:1/1;
            object-fit:cover;
            display:block;
        }

        .photo-buttons{
            display:flex;
            gap:5px;
            padding:7px;
        }

        .photo-buttons button{
            margin:0;
            padding:10px 4px;
            font-size:12px;
        }

        .download{
            background:#8d4dff;
            color:white;
        }

        .delete{
            background:#ff3d67;
            color:white;
        }

        .hearts{
            position:fixed;
            inset:0;
            overflow:hidden;
            pointer-events:none;
            opacity:.13;
            z-index:-1;
        }

        .hearts span{
            position:absolute;
            font-size:35px;
            animation:float 9s linear infinite;
        }

        .hearts span:nth-child(1){left:5%}
        .hearts span:nth-child(2){left:25%;animation-delay:2s}
        .hearts span:nth-child(3){left:50%;animation-delay:4s}
        .hearts span:nth-child(4){left:72%;animation-delay:6s}
        .hearts span:nth-child(5){left:90%;animation-delay:8s}

        @keyframes float{
            from{
                transform:translateY(110vh);
            }
            to{
                transform:translateY(-100px) rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="hearts">
        <span>🫀</span>
        <span>😘</span>
        <span>💋</span>
        <span>🫀</span>
        <span>😘</span>
    </div>

    <div id="app" class="wrap">

        <!-- USER LOGIN -->
        <div id="loginScreen" class="card">
            <div id="secretTitle" class="title">
                MOtki 🫀 Ghaltu
            </div>
            <div class="subtitle">
                Private Album
            </div>

            <input 
                id="userPassword" 
                type="password" 
                placeholder="Enter password"
            >

            <button onclick="userLogin()">
                Open Album
            </button>

            <div id="userStatus" class="status"></div>
        </div>

        <!-- USER ALBUM -->
        <div id="albumScreen" class="hidden">

            <div class="topbar">
                <div class="title">
                    MOtki 🫀 Ghaltu
                </div>
                <button class="menu" onclick="lockEverything()">
                    ⋮
                </button>
            </div>

            <div id="gallery" class="gallery"></div>

        </div>

        <!-- OWNER LOGIN -->
        <div id="ownerScreen" class="hidden card">

            <div class="title">
                👑 Owner Login
            </div>

            <input 
                id="ownerEmail" 
                type="email" 
                value="bishalff211@gmail.com" 
                readonly
            >

            <input 
                id="ownerPassword" 
                type="password" 
                placeholder="Owner password"
            >

            <button onclick="ownerLogin()">
                Owner Login
            </button>

            <button onclick="backToUser()">
                Back
            </button>

            <div id="ownerStatus" class="status"></div>

        </div>

        <!-- OWNER PANEL -->
        <div id="ownerPanel" class="hidden">

            <div class="topbar">
                <div class="title">
                    👑 Owner Panel
                </div>
                <button class="menu" onclick="lockEverything()">
                    ⋮
                </button>
            </div>

            <div class="card">
                <input 
                    id="fileInput" 
                    type="file" 
                    accept="image/*"
                >

                <button onclick="uploadPhoto()">
                    📥 Upload Photo
                </button>

                <div id="uploadStatus" class="status"></div>
            </div>

            <div id="ownerGallery" class="gallery"></div>

        </div>

    </div>

<script>

const OWNER_EMAIL = "bishalff211@gmail.com";
const USER_PASSWORD = "sabbis26";

/* ============================

============================ */

function $(id){
    return document.getElementById(id);
}

function status(id,text){
    $(id).textContent = text;
}

/* ============================
   USER LOGIN
============================ */

function userLogin(){
    const password = $("userPassword").value;

    if(password !== USER_PASSWORD){
        status("userStatus", "Wrong password");
        return;
    }

    $("loginScreen").classList.add("hidden");
    $("albumScreen").classList.remove("hidden");

    loadUserGallery();
}

/* ============================
   3 TAP OWNER
============================ */

let tapCount = 0;
let tapTimer = null;

$("secretTitle").addEventListener("click", function(){
    tapCount++;

    clearTimeout(tapTimer);

    tapTimer = setTimeout(function(){
        tapCount = 0;
    }, 800);

    if(tapCount === 3){
        tapCount = 0;
        $("loginScreen").classList.add("hidden");
        $("ownerScreen").classList.remove("hidden");
        $("ownerPassword").value = "";
        $("ownerStatus").textContent = "";
    }
});

/* ============================
   OWNER LOGIN
============================ */

function ownerLogin(){
    const password = $("ownerPassword").value;

    if(!password){
        status("ownerStatus", "Enter password");
        return;
    }

    if(password !== OWNER_PASSWORD){
        status("ownerStatus", "Wrong owner password");
        return;
    }

    $("ownerScreen").classList.add("hidden");
    $("ownerPanel").classList.remove("hidden");
    loadOwnerGallery();
}

/* ============================
   NAVIGATION & UI HELPERS
============================ */

function backToUser(){
    $("ownerScreen").classList.add("hidden");
    $("loginScreen").classList.remove("hidden");
}

function lockEverything(){
    $("albumScreen").classList.add("hidden");
    $("ownerPanel").classList.add("hidden");
    $("ownerScreen").classList.add("hidden");
    $("loginScreen").classList.remove("hidden");
    $("userPassword").value = "";
    $("ownerPassword").value = "";
    $("userStatus").textContent = "";
    $("ownerStatus").textContent = "";
}

function loadUserGallery(){

}

function loadOwnerGallery(){

}

function uploadPhoto(){

}

</script>
</body>
</html>
