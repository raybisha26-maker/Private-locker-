<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Locker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #1d1d1d;
      padding: 25px;
      border-radius: 18px;
      margin-top: 40px;
    }

    h1 {
      text-align: center;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: none;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      background: white;
      color: black;
      font-weight: bold;
    }

    button:active {
      transform: scale(.98);
    }

    .hidden {
      display: none;
    }

    #status,
    #appStatus {
      text-align: center;
      margin: 12px 0;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .photo {
      background: #222;
      border-radius: 12px;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      display: block;
    }

    .delete {
      background: #d33;
      color: white;
      border-radius: 0;
      margin: 0;
    }

    .logout {
      background: #333;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="card">
    <h1>🔐 Private Locker</h1>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <p id="status"></p>
  </div>


  <!-- APP -->
  <div id="appBox" class="hidden">

    <div class="card">
      <h1>🖼️ Private Photos</h1>

      <input
        id="photoFile"
        type="file"
        accept="image/*"
      >

      <button onclick="uploadPhoto()">
        ⬆️ Upload Photo
      </button>

      <button class="logout" onclick="logout()">
        🚪 Logout
      </button>

      <p id="appStatus"></p>
    </div>

    <div id="gallery" class="gallery"></div>

  </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* =========================
     SUPABASE SETTINGS
     ========================= */

  const SUPABASE_URL =
    "https://yhsmupqodypzjpehuaow.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_-wp0v9tq_CqtcxzSsT9Fgw_J4T0bB6S";

  const BUCKET =
    "MOtki Ghaltu";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     LOGIN
     ========================= */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const status =
      document.getElementById("status");

    status.textContent = "Logging in...";

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      status.textContent = error.message;
      return;
    }

    status.textContent = "";

    showApp();

    loadPhotos();
  }


  /* =========================
     SHOW APP
     ========================= */

  function showApp() {

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("appBox")
      .classList.remove("hidden");
  }


  /* =========================
     LOGOUT
     ========================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();
  }


  /* =========================
     UPLOAD PHOTO
     ========================= */

  async function uploadPhoto() {

    const fileInput =
      document.getElementById("photoFile");

    const status =
      document.getElementById("appStatus");

    const file = fileInput.files[0];

    if (!file) {
      status.textContent =
        "Please select a photo first.";
      return;
    }

    const { data: userData } =
      await supabaseClient.auth.getUser();

    const user = userData.user;

    if (!user) {
      status.textContent =
        "Please login first.";
      return;
    }

    status.textContent =
      "Uploading...";

    const filePath =
      user.id + "/" +
      Date.now() + "_" +
      file.name;

    const { error } =
      await supabaseClient.storage
        .from(BUCKET)
        .upload(filePath, file);

    if (error) {
      status.textContent =
        error.message;
      return;
    }

    status.textContent =
      "Photo uploaded successfully.";

    fileInput.value = "";

    loadPhotos();
  }


  /* =========================
     LOAD PHOTOS
     ========================= */

  async function loadPhotos() {

    const { data: userData } =
      await supabaseClient.auth.getUser();

    const user = userData.user;

    if (!user) {
      return;
    }

    const gallery =
      document.getElementById("gallery");

    gallery.innerHTML =
      "<p>Loading photos...</p>";


    const { data, error } =
      await supabaseClient.storage
        .from(BUCKET)
        .list(user.id, {
          limit: 100,
          sortBy: {
            column: "created_at",
            order: "desc"
          }
        });


    if (error) {

      gallery.innerHTML =
        "<p>" + error.message + "</p>";

      return;
    }


    gallery.innerHTML = "";


    if (!data || data.length === 0) {

      gallery.innerHTML =
        "<p>No photos yet.</p>";

      return;
    }


    for (const file of data) {

      if (!file.name) {
        continue;
      }

      const path =
        user.id + "/" + file.name;


      const { data: signedData, error: signedError } =
        await supabaseClient.storage
          .from(BUCKET)
          .createSignedUrl(
            path,
            3600
          );


      if (signedError) {
        continue;
      }


      const box =
        document.createElement("div");

      box.className =
        "photo";


      const img =
        document.createElement("img");

      img.src =
        signedData.signedUrl;

      img.loading =
        "lazy";


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete";

      deleteButton.textContent =
        "🗑️ Delete";


      deleteButton.onclick =
        function () {
          deletePhoto(path);
        };


      box.appendChild(img);

      box.appendChild(deleteButton);

      gallery.appendChild(box);
    }
  }


  /* =========================
     DELETE PHOTO
     ========================= */

  async function deletePhoto(path) {

    const confirmDelete =
      confirm(
        "Delete this photo?"
      );

    if (!confirmDelete) {
      return;
    }


    const { error } =
      await supabaseClient.storage
        .from(BUCKET)
        .remove([path]);


    if (error) {

      alert(error.message);

      return;
    }


    loadPhotos();
  }


  /* =========================
     CHECK LOGIN SESSION
     ========================= */

  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();


    if (data.session) {

      showApp();

      loadPhotos();
    }
  }


  checkSession();

</script>

</body>
</html>
