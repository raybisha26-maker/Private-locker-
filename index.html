<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cute Birthday Gift</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#000;
  font-family:Georgia,serif;
}

.app{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.scene{
  position:relative;
  width:min(100vw,720px);
  height:min(100vh,1280px);
  overflow:hidden;
  background:#fff7f2;
}

/* Top title */
.top-title{
  position:absolute;
  top:30px;
  left:0;
  width:100%;
  text-align:center;
  color:#fff;
  font-family:"Trebuchet MS",sans-serif;
  font-size:28px;
  font-weight:400;
  z-index:20;
}

/* Main birthday area */
.birthday{
  position:absolute;
  left:0;
  top:50%;
  transform:translateY(-50%);
  width:100%;
  height:48%;
  background:linear-gradient(
    110deg,
    #fff9f4,
    #ffdce5,
    #fff5ed
  );
  overflow:hidden;
}

/* soft glow */
.glow{
  position:absolute;
  width:300px;
  height:300px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(
    circle,
    rgba(255,120,170,.35),
    transparent 70%
  );
  filter:blur(12px);
}

/* Small text */
.small-text{
  position:absolute;
  top:38px;
  width:100%;
  text-align:center;
  color:#9c777e;
  font-size:13px;
  font-style:italic;
}

/* Heart */
.heart{
  position:absolute;
  left:50%;
  top:50%;
  width:82px;
  height:82px;
  transform:translate(-50%,-50%) rotate(-45deg);
  background:linear-gradient(135deg,#ff4e83,#e90055);
  border-radius:10px;
  cursor:grab;
  box-shadow:
    0 10px 25px rgba(230,0,80,.35),
    0 0 35px rgba(255,80,150,.45);
  transition:
    transform .35s ease,
    left .25s ease,
    top .25s ease;
  z-index:5;
}

.heart:before,
.heart:after{
  content:"";
  position:absolute;
  width:82px;
  height:82px;
  background:inherit;
  border-radius:50%;
}

.heart:before{
  top:-41px;
  left:0;
}

.heart:after{
  left:41px;
  top:0;
}

.heart-inner{
  position:absolute;
  width:100%;
  text-align:center;
  color:#fff;
  transform:rotate(45deg);
  z-index:3;
  font-family:Arial,sans-serif;
  font-size:12px;
  top:31px;
}

.instruction{
  position:absolute;
  bottom:22px;
  width:100%;
  text-align:center;
  color:#9b7b82;
  font-size:12px;
  letter-spacing:3px;
  font-style:italic;
}

/* Wish screen */
.wish{
  display:none;
  position:absolute;
  inset:0;
  background:linear-gradient(
    110deg,
    #fff7f0,
    #ffd9e2,
    #fff2e8
  );
  z-index:10;
  animation:fadeIn .8s ease;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

.wish-content{
  position:absolute;
  width:100%;
  top:50%;
  transform:translateY(-50%);
  text-align:center;
}

.make-wish{
  color:#9d777f;
  font-size:13px;
  font-style:italic;
  margin-bottom:25px;
}

.happy{
  color:#fff;
  font-size:clamp(55px,13vw,100px);
  line-height:.9;
  font-weight:bold;
  text-shadow:
    2px 3px 2px rgba(100,30,50,.35);
}

.line{
  width:170px;
  height:2px;
  background:#dca35f;
  margin:25px auto 10px;
}

.worth{
  color:#9d777f;
  font-size:13px;
  font-style:italic;
}

/* Final screen */
.final{
  display:none;
  position:absolute;
  inset:0;
  background:linear-gradient(
    110deg,
    #fff7f0,
    #ffe0e4,
    #fff4ea
  );
  z-index:15;
  animation:fadeIn 1s ease;
}

.final-small{
  position:absolute;
  top:34px;
  left:0;
  width:100%;
  text-align:center;
  color:#9d777f;
  font-size:12px;
  font-style:italic;
}

/* Heart tree */
.tree{
  position:absolute;
  left:50%;
  top:44%;
  transform:translate(-50%,-50%);
  width:330px;
  height:420px;
}

/* trunk */
.trunk{
  position:absolute;
  left:50%;
  bottom:10px;
  width:13px;
  height:230px;
  transform:translateX(-50%);
  background:linear-gradient(
    90deg,
    #3b2024,
    #713a40,
    #3b2024
  );
  border-radius:10px;
}

/* branches */
.branch{
  position:absolute;
  height:6px;
  background:#593034;
  border-radius:10px;
  transform-origin:left center;
}

.b1{
  left:50%;
  bottom:170px;
  width:120px;
  transform:rotate(-32deg);
}

.b2{
  right:50%;
  bottom:205px;
  width:105px;
  transform:rotate(32deg);
}

.b3{
  left:50%;
  bottom:250px;
  width:90px;
  transform:rotate(-48deg);
}

/* heart flowers */
.flower{
  position:absolute;
  width:19px;
  height:19px;
  transform:rotate(-45deg);
  background:#f06292;
  border-radius:5px;
  box-shadow:0 2px 5px rgba(180,40,90,.25);
  animation:floatHeart 2s infinite ease-in-out alternate;
}

.flower:before,
.flower:after{
  content:"";
  position:absolute;
  width:19px;
  height:19px;
  background:inherit;
  border-radius:50%;
}

.flower:before{
  top:-9px;
  left:0;
}

.flower:after{
  top:0;
  left:9px;
}

@keyframes floatHeart{
  from{transform:rotate(-45deg) translateY(0)}
  to{transform:rotate(-45deg) translateY(-3px)}
}

.f1{left:150px;top:20px}
.f2{left:105px;top:45px}
.f3{left:190px;top:50px}
.f4{left:65px;top:80px}
.f5{left:145px;top:85px}
.f6{left:225px;top:90px}
.f7{left:90px;top:120px}
.f8{left:175px;top:125px}
.f9{left:245px;top:125px}
.f10{left:120px;top:155px}
.f11{left:205px;top:155px}
.f12{left:65px;top:150px}
.f13{left:150px;top:180px}
.f14{left:225px;top:185px}
.f15{left:95px;top:205px}
.f16{left:185px;top:215px}
.f17{left:255px;top:175px}
.f18{left:120px;top:240px}
.f19{left:215px;top:245px}

/* final birthday text */
.final-message{
  position:absolute;
  left:30px;
  bottom:45px;
  color:#d24d73;
  font-family:cursive;
  font-size:clamp(30px,8vw,58px);
  line-height:.9;
}

.final-message small{
  display:block;
  color:#9d777f;
  font-family:Georgia,serif;
  font-size:11px;
  margin-top:12px;
  line-height:1.3;
}

.petals span{
  position:absolute;
  color:#f39ab5;
  font-size:18px;
  animation:fall 4s infinite linear;
}

@keyframes fall{
  0%{
    transform:translateY(-40px) rotate(0);
    opacity:0;
  }
  20%{opacity:1}
  100%{
    transform:translateY(650px) rotate(180deg);
    opacity:0;
  }
}

.p1{left:15%;top:20%;animation-delay:.2s}
.p2{left:30%;top:5%;animation-delay:1s}
.p3{left:72%;top:10%;animation-delay:1.7s}
.p4{left:85%;top:30%;animation-delay:2.4s}
.p5{left:55%;top:5%;animation-delay:3s}

/* Mobile */
@media(max-width:500px){
  .top-title{
    top:22px;
    font-size:25px;
  }

  .birthday{
    height:46%;
  }

  .tree{
    transform:translate(-50%,-50%) scale(.85);
  }

  .final-message{
    left:22px;
    bottom:35px;
  }
}
</style>
</head>

<body>

<div class="app">

<div class="scene">

  <div class="top-title">
    Cute Birthday gift
  </div>

  <!-- FIRST SCREEN -->
  <section class="birthday" id="birthday">

    <div class="glow"></div>

    <div class="small-text">
      a little something, for you
    </div>

    <div
      class="heart"
      id="heart"
      ontouchstart="startDrag(event)"
      ontouchmove="drag(event)"
      ontouchend="releaseHeart(event)"
      onmousedown="startDrag(event)"
    >
      <div class="heart-inner">♥</div>
    </div>

    <div class="instruction">
      PULL &amp; RELEASE
    </div>

  </section>


  <!-- HAPPY BIRTHDAY SCREEN -->
  <section class="wish" id="wish">

    <div class="wish-content">

      <div class="make-wish">
        make a wish...
      </div>

      <div class="happy">
        Happy<br>
        Birthday
      </div>

      <div class="line"></div>

      <div class="worth">
        to someone worth celebrating
      </div>

    </div>

  </section>


  <!-- FINAL SCREEN -->
  <section class="final" id="final">

    <div class="final-small">
      and... make it count
    </div>

    <div class="petals">
      <span class="p1">♥</span>
      <span class="p2">♥</span>
      <span class="p3">♥</span>
      <span class="p4">♥</span>
      <span class="p5">♥</span>
    </div>

    <div class="tree">

      <div class="trunk"></div>

      <div class="branch b1"></div>
      <div class="branch b2"></div>
      <div class="branch b3"></div>

      <div class="flower f1"></div>
      <div class="flower f2"></div>
      <div class="flower f3"></div>
      <div class="flower f4"></div>
      <div class="flower f5"></div>
      <div class="flower f6"></div>
      <div class="flower f7"></div>
      <div class="flower f8"></div>
      <div class="flower f9"></div>
      <div class="flower f10"></div>
      <div class="flower f11"></div>
      <div class="flower f12"></div>
      <div class="flower f13"></div>
      <div class="flower f14"></div>
      <div class="flower f15"></div>
      <div class="flower f16"></div>
      <div class="flower f17"></div>
      <div class="flower f18"></div>
      <div class="flower f19"></div>

    </div>

    <div class="final-message">
      Happy Birthday
      <small>
        here's to a year that's full of beautiful moments.
      </small>
    </div>

  </section>

</div>
</div>


<script>

const heart = document.getElementById("heart");
const birthday = document.getElementById("birthday");
const wish = document.getElementById("wish");
const finalScreen = document.getElementById("final");

let dragging = false;
let startY = 0;
let moved = false;

function startDrag(e){

  dragging = true;
  moved = false;

  startY =
    e.touches
      ? e.touches[0].clientY
      : e.clientY;

  heart.style.cursor = "grabbing";
}

function drag(e){

  if(!dragging) return;

  const y =
    e.touches
      ? e.touches[0].clientY
      : e.clientY;

  const distance = y - startY;

  if(Math.abs(distance) > 20){
    moved = true;
  }

  /*
    Heart follows the finger/mouse
  */
  heart.style.top =
    "calc(50% + " +
    Math.max(-100,Math.min(100,distance)) +
    "px)";
}

function releaseHeart(e){

  if(!dragging) return;

  dragging = false;

  heart.style.cursor = "grab";

  /*
    If user actually pulls the heart,
    start the surprise.
  */

  if(moved){

    heart.style.top = "20%";
    heart.style.transform =
      "translate(-50%,-50%) rotate(-45deg) scale(.2)";

    setTimeout(() => {

      birthday.style.display = "none";

      wish.style.display = "block";

      /*
        Happy Birthday stays for a moment,
        then final heart tree appears.
      */

      setTimeout(() => {

        wish.style.display = "none";

        finalScreen.style.display = "block";

      },4000);

    },600);

  }else{

    heart.style.top = "50%";

  }

}


/*
  Mouse support
*/

document.addEventListener("mousemove",function(e){

  if(dragging){
    drag(e);
  }

});

document.addEventListener("mouseup",function(){

  if(dragging){
    releaseHeart({});
  }

});

</script>

</body>
      </html>
