<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prank 😂</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 100%;
      max-width: 700px;
      text-align: center;
      padding: 15px;
    }

    .box img {
      width: 100%;
      display: block;
      border-radius: 16px;
    }

    .title {
      margin-top: 18px;
      color: #ffd400;
      font-size: clamp(30px, 8vw, 58px);
      font-weight: 900;
      text-shadow: 3px 3px 0 #111;
    }

    .sub {
      margin-top: 12px;
      color: white;
      font-size: clamp(24px, 6vw, 42px);
      font-weight: 900;
    }
  </style>
</head>

<body>

  <div class="box">

    <!-- PHOTO -->
    <img
      src="YOUR_PHOTO_LINK_HERE"
      alt="CID Photo"
    >

    <!-- TEXT -->
    <div class="title">
      Kue Re Madharchod
    </div>

    <div class="sub">
      Padhle bhosdi ke 😂
    </div>

  </div>

</body>
</html>
