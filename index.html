<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MOtki 🫀 Ghaltu</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at 15% 20%,#8b2cff55,transparent 30%),
    radial-gradient(circle at 85% 80%,#ff3f9f55,transparent 30%),
    linear-gradient(135deg,#17002b,#07000f);
}

.hearts{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  opacity:.18;
}

.hearts span{
  position:absolute;
  font-size:35px;
  animation:float 8s linear infinite;
}

.hearts span:nth-child(1){left:5%;animation-delay:0s}
.hearts span:nth-child(2){left:20%;animation-delay:2s}
.hearts span:nth-child(3){left:40%;animation-delay:4s}
.hearts span:nth-child(4){left:65%;animation-delay:1s}
.hearts span:nth-child(5){left:85%;animation-delay:3s}

@keyframes float{
  from{transform:translateY(110vh) rotate(0deg)}
  to{transform:translateY(-120px) rotate(360deg)}
}

.container{
  position:relative;
  z-index:2;
  width:100%;
  max-width:850px;
  margin:auto;
  padding:25px 15px;
}

.card{
  background:#ffffff12;
  border:1px solid #ffffff25;
  backdrop-filter:blur(14px);
  border-radius:25px;
  padding:25px;
  box-shadow:0 15px 50px #0008;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  opacity:.7;
  margin-bottom:25px;
}

input,button{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:0;
  border-radius:13px;
  font-size:15px;
}

input{
  background:#ffffff12;
  color:white;
  border:1px solid #ffffff25;
}

input::placeholder{
  color:#ffffff80;
}

button{
  background:white;
  color:#160020;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.hidden{
  display:none!important;
}

.status{
  text-align:center;
  min-height:20px;
  margin:10px 0;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:20px;
}

.photo{
  background:#ffffff10;
  border:1px solid #ffffff20;
  border-radius:15px;
  overflow:hidden;
}

.photo img{
  width:100%;
  display:block;
  aspect-ratio:1/1;
  object-fit:cover;
}

.photo-buttons{
  display:flex;
  gap:5px;
  padding:7px;
}

.photo-buttons button{
  margin:0;
  padding:10px 5px;
}

.download{
  background:#8d4dff;
  color:white;
}

.delete{
  background:#e63956;
  color:white;
}

.owner-box{
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #ffffff20;
}

.small{
  font-size:12px;
  opacity:.6;
  text-align:center;
  margin-top:15px;
}

@media(max-width:500px){
  .gallery{
    grid-template-columns:1fr 1fr;
  }

  .logo{
    font-size:25px;
  }
}
</style>
</head>

<body>

<div class="hearts">
  <span>💜</span>
  <span>🫀</span>
  <span>💗</span>
  <span>💜</span>
  <span>💕</span>
</div>

<div class="container">

  <!-- WEBSITE PASSWORD -->
  <div id="passwordScreen" class="card">
    <div class="logo">MOtki 🫀 Ghaltu</div>
    <div class="subtitle">Private Photo Locker 💜</div>

    <input
      id="sitePassword"
      type="password"
      placeholder="Enter password"
      autocomplete="off"
    >

    <button onclick="unlockWebsite()">
      🔐 Enter
    </button>

    <div id="passwordStatus" class="status"></div>

    <div class="small">
      Enter the password to view the gallery
    </div>
  </div>


  <!-- GALLERY -->
  <div id="galleryScreen" class="hidden">

    <div class="card">

      <div class="logo">MOtki 🫀 Ghaltu</div>
      <div class="subtitle">💜 My Private Gallery 💜</div>

      <div id="ownerControls" class="hidden owner-box">

        <input
          id="photoFile"
          type="file"
          accept="image/*"
        >

        <button onclick="uploadPhoto()">
          ⬆️ Upload Photo
        </button>

        <button onclick="ownerLogout()">
          🚪 Owner Logout
        </button>

        <div id="uploadStatus" class="status"></div>

      </div>

      <div id="galleryStatus" class="status">
        Loading photos...
      </div>

      <div id="gallery" class="gallery"></div>

      <button onclick="logoutViewer()">
        🔒 Lock Gallery
      </button>

    </div>

  </div>


  <!-- OWNER LOGIN -->
  <div id="ownerLoginScreen" class="hidden">
    <div class="card">

      <div class="logo">👑 Owner Login</div>

      <input
        id="ownerEmail"
        type="email"
        placeholder="Owner email"
      >

      <input
        id="ownerPassword"
        type="password"
        placeholder="Owner password"
      >

      <button onclick="ownerLogin()">
        Login as Owner
      </button>

      <div id="ownerStatus" class="status"></div>

      <button onclick="closeOwnerLogin()">
        Back
      </button>

    </div>
  </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =================================
   SUPABASE CONFIG
   ================================= */

const SUPABASE_URL =
  "https://yhsmupqodypzjpehuaow.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-wp0v9tq_CqtcxzSsT9Fgw_J4T0bB6S";

const BUCKET =
  "MOtki Ghaltu";

const OWNER_EMAIL =
  "raybisha26@gmail.com";

const VIEWER_PASSWORD =
  "sabbis26";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =================================
   WEBSITE PASSWORD
   ================================= */

function unlockWebsite(){

  const input =
    document.getElementById("sitePassword").value;

  const status =
    document.getElementById("passwordStatus");

  if(input !== VIEWER_PASSWORD){

    status.textContent =
      "❌ Wrong password";

    return;
  }

  status.textContent = "";

  document
    .getElementById("passwordScreen")
    .classList.add("hidden");

  document
    .getElementById("galleryScreen")
    .classList.remove("hidden");

  loadPhotos();
}


/* =================================
   LOAD PHOTOS
   ================================= */

async function loadPhotos(){

  const gallery =
    document.getElementById("gallery");

  const status =
    document.getElementById("galleryStatus");

  gallery.innerHTML = "";

  status.textContent =
    "Loading photos...";


  const {data,error} =
    await supabaseClient.storage
      .from(BUCKET)
      .list("",{
        limit:100,
        sortBy:{
          column:"created_at",
          order:"desc"
        }
      });


  if(error){

    status.textContent =
      "❌ " + error.message;

    return;
  }


  if(!data || data.length === 0){

    status.textContent =
      "No photos yet.";

    return;
  }


  status.textContent = "";


  for(const file of data){

    if(!file.name) continue;


    const {data:urlData,error:urlError} =
      supabaseClient.storage
        .from(BUCKET)
        .getPublicUrl(file.name);


    if(urlError) continue;


    const box =
      document.createElement("div");

    box.className =
      "photo";


    const img =
      document.createElement("img");

    img.src =
      urlData.publicUrl;

    img.loading =
      "lazy";


    const buttons =
      document.createElement("div");

    buttons.className =
      "photo-buttons";


    const download =
      document.createElement("button");

    download.className =
      "download";

    download.textContent =
      "⬇️ Download";


    download.onclick =
      function(){

        const link =
          document.createElement("a");

        link.href =
          urlData.publicUrl;

        link.download =
          file.name;

        link.target =
          "_blank";

        link.click();
      };


    buttons.appendChild(download);


    /* DELETE BUTTON ONLY FOR OWNER */

    const owner =
      document
        .getElementById("ownerControls")
        .classList
        .contains("hidden") === false;


    if(owner){

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete";

      deleteButton.textContent =
        "🗑️ Delete";


      deleteButton.onclick =
        function(){
          deletePhoto(file.name);
        };


      buttons.appendChild(deleteButton);
    }


    box.appendChild(img);
    box.appendChild(buttons);

    gallery.appendChild(box);
  }
}


/* =================================
   OWNER LOGIN
   ================================= */

async function ownerLogin(){

  const email =
    document.getElementById("ownerEmail").value.trim();

  const password =
    document.getElementById("ownerPassword").value;

  const status =
    document.getElementById("ownerStatus");


  if(email !== OWNER_EMAIL){

    status.textContent =
      "❌ Owner account only.";

    return;
  }


  status.textContent =
    "Logging in...";


  const {error} =
    await supabaseClient.auth
      .signInWithPassword({
        email:email,
        password:password
      });


  if(error){

    status.textContent =
      "❌ " + error.message;

    return;
  }


  document
    .getElementById("ownerLoginScreen")
    .classList.add("hidden");

  document
    .getElementById("galleryScreen")
    .classList.remove("hidden");

  document
    .getElementById("ownerControls")
    .classList.remove("hidden");


  loadPhotos();
}


/* =================================
   UPLOAD
   ================================= */

async function uploadPhoto(){

  const fileInput =
    document.getElementById("photoFile");

  const status =
    document.getElementById("uploadStatus");

  const file =
    fileInput.files[0];


  if(!file){

    status.textContent =
      "Select a photo first.";

    return;
  }


  const {data:userData} =
    await supabaseClient.auth.getUser();

  const user =
    userData.user;


  if(!user || user.email !== OWNER_EMAIL){

    status.textContent =
      "❌ Owner access required.";

    return;
  }


  status.textContent =
    "Uploading...";


  const fileName =
    Date.now() + "_" +
    file.name;


  const {error} =
    await supabaseClient.storage
      .from(BUCKET)
      .upload(fileName,file);


  if(error){

    status.textContent =
      "❌ " + error.message;

    return;
  }


  status.textContent =
    "✅ Uploaded.";

  fileInput.value = "";

  loadPhotos();
}


/* =================================
   DELETE
   ================================= */

async function deletePhoto(fileName){

  if(!confirm("Delete this photo?"))
    return;


  const {data:userData} =
    await supabaseClient.auth.getUser();

  const user =
    userData.user;


  if(!user || user.email !== OWNER_EMAIL){

    alert("Owner access required.");

    return;
  }


  const {error} =
    await supabaseClient.storage
      .from(BUCKET)
      .remove([fileName]);


  if(error){

    alert(error.message);

    return;
  }


  loadPhotos();
}


/* =================================
   OWNER LOGOUT
   ================================= */

async function ownerLogout(){

  await supabaseClient.auth.signOut();

  document
    .getElementById("ownerControls")
    .classList.add("hidden");

  loadPhotos();
}


/* =================================
   OWNER LOGIN BUTTON
   ================================= */

/*
   Long-press / triple click on title
   opens owner login.
*/

let taps = 0;

document
  .querySelector(".logo")
  .addEventListener("click",function(){

    taps++;

    if(taps >= 3){

      taps = 0;

      document
        .getElementById("galleryScreen")
        .classList.add("hidden");

      document
        .getElementById("ownerLoginScreen")
        .classList.remove("hidden");
    }

    setTimeout(()=>{
      taps = 0;
    },700);

  });


function closeOwnerLogin(){

  document
    .getElementById("ownerLoginScreen")
    .classList.add("hidden");

  document
    .getElementById("galleryScreen")
    .classList.remove("hidden");
}


/* =================================
   LOCK
   ================================= */

function logoutViewer(){

  document
    .getElementById("galleryScreen")
    .classList.add("hidden");

  document
    .getElementById("passwordScreen")
    .classList.remove("hidden");

  document
    .getElementById("sitePassword")
    .value = "";

}


/* =================================
   ENTER KEY
   ================================= */

document
  .getElementById("sitePassword")
  .addEventListener("keydown",function(e){

    if(e.key === "Enter"){
      unlockWebsite();
    }

  });

</script>

</body>
</html>
