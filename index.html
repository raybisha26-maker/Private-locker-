<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MOtki 🫀 Ghaltu</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 10%,#9b27ff55,transparent 30%),
    radial-gradient(circle at 90% 90%,#ff3b9d55,transparent 30%),
    linear-gradient(145deg,#100019,#21002e,#09000f);
  color:#fff;
}

button,input{font:inherit}

.hidden{display:none!important}

.hearts{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  opacity:.12;
  z-index:0;
}

.hearts span{
  position:absolute;
  font-size:35px;
  animation:heartFloat 9s linear infinite;
}

.hearts span:nth-child(1){left:5%;animation-delay:0s}
.hearts span:nth-child(2){left:25%;animation-delay:2s}
.hearts span:nth-child(3){left:48%;animation-delay:4s}
.hearts span:nth-child(4){left:70%;animation-delay:1s}
.hearts span:nth-child(5){left:90%;animation-delay:3s}

@keyframes heartFloat{
  from{transform:translateY(110vh) rotate(0)}
  to{transform:translateY(-120px) rotate(360deg)}
}

/* PASSWORD */

#lockScreen{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.lockCard{
  width:100%;
  max-width:370px;
  padding:30px 22px;
  text-align:center;
  border-radius:28px;
  background:#ffffff12;
  border:1px solid #ffffff25;
  backdrop-filter:blur(18px);
  box-shadow:0 20px 60px #0009;
}

.logo{
  font-size:29px;
  font-weight:800;
  margin-bottom:8px;
}

.sub{
  opacity:.65;
  margin-bottom:25px;
}

.lockInput{
  width:100%;
  padding:15px;
  border-radius:15px;
  border:1px solid #ffffff25;
  outline:none;
  background:#ffffff12;
  color:white;
  text-align:center;
}

.lockInput::placeholder{
  color:#ffffff75;
}

.mainBtn{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:15px;
  background:white;
  color:#19001f;
  font-weight:bold;
}

.error{
  color:#ff8eae;
  margin-top:12px;
  min-height:20px;
}

/* APP */

#app{
  position:relative;
  z-index:2;
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 16px;
  background:#120018dd;
  backdrop-filter:blur(16px);
  border-bottom:1px solid #ffffff15;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.topMenu{
  position:relative;
}

.menuBtn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#ffffff14;
  color:white;
  font-size:25px;
}

.menuBox{
  position:absolute;
  right:0;
  top:50px;
  width:190px;
  padding:8px;
  border-radius:16px;
  background:#21002fee;
  border:1px solid #ffffff20;
  box-shadow:0 12px 35px #0009;
}

.menuBox button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:white;
  text-align:left;
}

.menuBox button:hover{
  background:#ffffff12;
}

.gallery{
  padding:12px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.tile{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  background:#ffffff0c;
  cursor:pointer;
}

.tile img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.empty{
  text-align:center;
  padding:60px 20px;
  opacity:.65;
}

/* FULL SCREEN VIEWER */

.viewer{
  position:fixed;
  inset:0;
  z-index:100;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.viewer img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

.viewerTop{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:5;
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:linear-gradient(#000b,transparent);
}

.circleBtn{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#ffffff18;
  color:white;
  font-size:23px;
}

.viewerMenu{
  position:absolute;
  right:15px;
  top:65px;
  width:190px;
  padding:8px;
  border-radius:15px;
  background:#171717f5;
}

.viewerMenu button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  color:white;
  background:transparent;
  text-align:left;
}

.viewerMenu button:hover{
  background:#ffffff15;
}

/* OWNER */

.ownerPanel{
  padding:15px;
  background:#ffffff09;
  border-bottom:1px solid #ffffff12;
}

.ownerPanel input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #ffffff20;
  background:#ffffff10;
  color:white;
}

.ownerActions{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.ownerActions button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:12px;
  font-weight:bold;
}

.uploadBtn{
  background:white;
  color:#19001f;
}

.logoutBtn{
  background:#ffffff15;
  color:white;
}

.status{
  text-align:center;
  padding:8px;
  min-height:20px;
}

.deleteBtn{
  color:#ff6c8f!important;
}

@media(max-width:500px){
  .gallery{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<div class="hearts">
  <span>💜</span>
  <span>🫀</span>
  <span>💗</span>
  <span>💜</span>
  <span>💕</span>
</div>

<!-- PASSWORD -->

<section id="lockScreen">

  <div class="lockCard">

    <div class="logo">MOtki 🫀 Ghaltu</div>

    <div class="sub">
      💜 Private Album
    </div>

    <input
      id="sitePassword"
      class="lockInput"
      type="password"
      placeholder="Enter password"
      autocomplete="off"
    >

    <button class="mainBtn" onclick="unlock()">
      🔐 Open Album
    </button>

    <div id="lockError" class="error"></div>

  </div>

</section>


<!-- APP -->

<section id="app" class="hidden">

  <header class="topbar">

    <div class="title">
      MOtki 🫀 Ghaltu
    </div>

    <div class="topMenu">

      <button class="menuBtn" onclick="toggleMainMenu()">
        ⋮
      </button>

      <div id="mainMenu" class="menuBox hidden">

        <button onclick="openOwnerLogin()">
          👑 Owner Login
        </button>

        <button onclick="lockAlbum()">
          🔒 Lock Album
        </button>

      </div>

    </div>

  </header>


  <!-- OWNER CONTROLS -->

  <div id="ownerPanel" class="ownerPanel hidden">

    <input
      id="photoFile"
      type="file"
      accept="image/*"
    >

    <div class="ownerActions">

      <button
        class="uploadBtn"
        onclick="uploadPhoto()"
      >
        ⬆️ Upload
      </button>

      <button
        class="logoutBtn"
        onclick="ownerLogout()"
      >
        🚪 Logout
      </button>

    </div>

    <div id="uploadStatus" class="status"></div>

  </div>


  <div id="galleryStatus" class="status">
    Loading...
  </div>

  <main id="gallery" class="gallery"></main>

</section>


<!-- FULL PHOTO VIEWER -->

<div id="viewer" class="viewer hidden">

  <div class="viewerTop">

    <button
      class="circleBtn"
      onclick="closeViewer()"
    >
      ←
    </button>

    <button
      class="circleBtn"
      onclick="toggleViewerMenu()"
    >
      ⋮
    </button>

  </div>


  <img id="viewerImage" src="" alt="Photo">


  <div id="viewerMenu" class="viewerMenu hidden">

    <button onclick="downloadCurrent()">
      ⬇️ Download
    </button>

    <button
      id="viewerDelete"
      class="deleteBtn hidden"
      onclick="deleteCurrent()"
    >
      🗑️ Delete
    </button>

  </div>

</div>


<!-- OWNER LOGIN -->

<div id="ownerLogin" class="lockScreen hidden">

  <div class="lockCard">

    <div class="logo">👑 Owner</div>

    <div class="sub">
      Owner Login
    </div>

    <input
      id="ownerEmail"
      class="lockInput"
      type="email"
      placeholder="Owner email"
    >

    <input
      id="ownerPassword"
      class="lockInput"
      type="password"
      placeholder="Owner password"
    >

    <button
      class="mainBtn"
      onclick="loginOwner()"
    >
      Login
    </button>

    <div id="ownerError" class="error"></div>

    <button
      class="mainBtn"
      onclick="closeOwnerLogin()"
    >
      Back
    </button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SETTINGS
========================= */

const SUPABASE_URL =
  "https://yhsmupqodypzjpehuaow.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-wp0v9tq_CqtcxzSsT9Fgw_J4T0bB6S";

const BUCKET =
  "MOtki Ghaltu";

const OWNER_EMAIL =
  "raybisha26@gmail.com";

const VIEWER_PASSWORD =
  "sabbis26";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentFile = null;


/* =========================
   VIEWER PASSWORD
========================= */

function unlock(){

  const password =
    document.getElementById("sitePassword").value;

  if(password !== VIEWER_PASSWORD){

    document.getElementById("lockError").textContent =
      "❌ Wrong password";

    return;
  }

  document.getElementById("lockScreen")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  loadPhotos();
}


/* =========================
   LOAD ALBUM
========================= */

async function loadPhotos(){

  const gallery =
    document.getElementById("gallery");

  const status =
    document.getElementById("galleryStatus");

  gallery.innerHTML = "";

  status.textContent =
    "Loading photos...";


  const {data,error} =
    await supabaseClient.storage
      .from(BUCKET)
      .list("",{
        limit:100,
        sortBy:{
          column:"created_at",
          order:"desc"
        }
      });


  if(error){

    status.textContent =
      "❌ " + error.message;

    return;
  }


  if(!data || data.length === 0){

    status.textContent =
      "No photos yet 💜";

    return;
  }


  status.textContent = "";


  for(const file of data){

    if(!file.name) continue;


    const {data:urlData} =
      supabaseClient.storage
        .from(BUCKET)
        .getPublicUrl(file.name);


    const tile =
      document.createElement("div");

    tile.className = "tile";


    const img =
      document.createElement("img");

    img.src =
      urlData.publicUrl;

    img.loading =
      "lazy";


    tile.appendChild(img);


    tile.onclick = () => {

      openViewer(
        file.name,
        urlData.publicUrl
      );

    };


    gallery.appendChild(tile);

  }

}


/* =========================
   PHOTO VIEWER
========================= */

function openViewer(fileName,url){

  currentFile = {
    name:fileName,
    url:url
  };

  document.getElementById("viewerImage")
    .src = url;

  document.getElementById("viewer")
    .classList.remove("hidden");

  document.getElementById("viewerMenu")
    .classList.add("hidden");

  updateDeleteButton();
}


function closeViewer(){

  document.getElementById("viewer")
    .classList.add("hidden");

  document.getElementById("viewerImage")
    .src = "";

  currentFile = null;
}


function toggleViewerMenu(){

  document.getElementById("viewerMenu")
    .classList.toggle("hidden");

}


/* =========================
   DOWNLOAD
========================= */

function downloadCurrent(){

  if(!currentFile) return;

  const link =
    document.createElement("a");

  link.href =
    currentFile.url;

  link.download =
    currentFile.name;

  link.target =
    "_blank";

  document.body.appendChild(link);

  link.click();

  link.remove();

}


/* =========================
   OWNER LOGIN
========================= */

async function loginOwner(){

  const email =
    document.getElementById("ownerEmail")
      .value.trim();

  const password =
    document.getElementById("ownerPassword")
      .value;

  const error =
    document.getElementById("ownerError");


  if(email !== OWNER_EMAIL){

    error.textContent =
      "❌ Owner account only";

    return;
  }


  error.textContent =
    "Logging in...";


  const {error:loginError} =
    await supabaseClient.auth
      .signInWithPassword({
        email:email,
        password:password
      });


  if(loginError){

    error.textContent =
      "❌ " + loginError.message;

    return;
  }


  document.getElementById("ownerLogin")
    .classList.add("hidden");

  document.getElementById("ownerPanel")
    .classList.remove("hidden");


  updateDeleteButton();

  loadPhotos();
}


function openOwnerLogin(){

  document.getElementById("mainMenu")
    .classList.add("hidden");

  document.getElementById("ownerLogin")
    .classList.remove("hidden");

}


function closeOwnerLogin(){

  document.getElementById("ownerLogin")
    .classList.add("hidden");

}


/* =========================
   OWNER CHECK
========================= */

async function isOwner(){

  const {data} =
    await supabaseClient.auth.getUser();

  return !!(
    data.user &&
    data.user.email === OWNER_EMAIL
  );

}


async function updateDeleteButton(){

  const owner =
    await isOwner();

  const btn =
    document.getElementById("viewerDelete");

  if(owner){

    btn.classList.remove("hidden");

  }else{

    btn.classList.add("hidden");

  }

}


/* =========================
   UPLOAD
========================= */

async function uploadPhoto(){

  if(!(await isOwner())){

    alert("Owner access required.");

    return;
  }


  const input =
    document.getElementById("photoFile");

  const file =
    input.files[0];


  if(!file){

    alert("Choose a photo first.");

    return;
  }


  const status =
    document.getElementById("uploadStatus");

  status.textContent =
    "Uploading...";


  const safeName =
    Date.now() + "_" +
    file.name.replace(/[^a-zA-Z0-9._-]/g,"_");


  const {error} =
    await supabaseClient.storage
      .from(BUCKET)
      .upload(safeName,file);


  if(error){

    status.textContent =
      "❌ " + error.message;

    return;
  }


  status.textContent =
    "✅ Uploaded";

  input.value = "";

  loadPhotos();

}


/* =========================
   DELETE
========================= */

async function deleteCurrent(){

  if(!currentFile) return;


  if(!(await isOwner())){

    alert("Owner access required.");

    return;
  }


  const yes =
    confirm("Delete this photo?");


  if(!yes) return;


  const {error} =
    await supabaseClient.storage
      .from(BUCKET)
      .remove([
        currentFile.name
      ]);


  if(error){

    alert(error.message);

    return;
  }


  closeViewer();

  loadPhotos();

}


/* =========================
   OWNER LOGOUT
========================= */

async function ownerLogout(){

  await supabaseClient.auth.signOut();

  document.getElementById("ownerPanel")
    .classList.add("hidden");

  updateDeleteButton();

  loadPhotos();

}


/* =========================
   MENU
========================= */

function toggleMainMenu(){

  document.getElementById("mainMenu")
    .classList.toggle("hidden");

}


/* =========================
   LOCK ALBUM
========================= */

function lockAlbum(){

  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("lockScreen")
    .classList.remove("hidden");

  document.getElementById("sitePassword")
    .value = "";

}


/* =========================
   KEYBOARD
========================= */

document.getElementById("sitePassword")
.addEventListener("keydown",(e)=>{

  if(e.key === "Enter"){
    unlock();
  }

});

</script>

</body>
  </html>
