<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOtki 🫀 Ghaltu</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 15%,#9b35ff55,transparent 30%),
    radial-gradient(circle at 85% 85%,#ff3d9d55,transparent 30%),
    linear-gradient(145deg,#100018,#26002f,#08000d);
}

button,input{font:inherit}

.hidden{display:none!important}

.wrap{
  max-width:480px;
  margin:auto;
  padding:25px 18px;
}

.title{
  text-align:center;
  font-size:29px;
  font-weight:bold;
  margin:12px 0;
  user-select:none;
}

.subtitle{
  text-align:center;
  opacity:.7;
  margin-bottom:25px;
}

.card{
  background:#ffffff10;
  border:1px solid #ffffff20;
  border-radius:20px;
  padding:20px;
  backdrop-filter:blur(12px);
}

input,button{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:0;
  border-radius:13px;
}

input{
  background:#ffffff12;
  color:white;
  border:1px solid #ffffff25;
}

input::placeholder{
  color:#ffffff80;
}

button{
  background:white;
  color:#160020;
  font-weight:bold;
}

.status{
  text-align:center;
  min-height:20px;
  margin:10px 0;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.topbar .title{
  flex:1;
}

.menu{
  width:45px;
  padding:8px;
  background:#ffffff15;
  color:white;
  font-size:25px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:20px;
}

.photo{
  background:#ffffff10;
  border:1px solid #ffffff20;
  border-radius:15px;
  overflow:hidden;
}

.photo img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}

.photo-buttons{
  display:flex;
  gap:5px;
  padding:7px;
}

.photo-buttons button{
  margin:0;
  padding:10px 4px;
  font-size:12px;
}

.download{
  background:#8d4dff;
  color:white;
}

.delete{
  background:#ff3d67;
  color:white;
}

.hearts{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  opacity:.13;
  z-index:-1;
}

.hearts span{
  position:absolute;
  font-size:35px;
  animation:float 9s linear infinite;
}

.hearts span:nth-child(1){left:5%}
.hearts span:nth-child(2){left:25%;animation-delay:2s}
.hearts span:nth-child(3){left:50%;animation-delay:4s}
.hearts span:nth-child(4){left:72%;animation-delay:1s}
.hearts span:nth-child(5){left:90%;animation-delay:3s}

@keyframes float{
  from{
    transform:translateY(110vh);
  }
  to{
    transform:translateY(-100px) rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="hearts">
  <span>🫀</span>
  <span>😘</span>
  <span>💋</span>
  <span>🫀</span>
  <span>😘</span>
</div>

<div id="app" class="wrap">

  <!-- USER LOGIN -->
  <div id="loginScreen" class="card">

    <div id="secretTitle" class="title">
      MOtki 🫀 Ghaltu
    </div>

    <div class="subtitle">
      Private Album
    </div>

    <input
      id="userPassword"
      type="password"
      placeholder="Enter password"
    >

    <button onclick="userLogin()">
      Open Album
    </button>

    <div id="userStatus" class="status"></div>
  </div>


  <!-- USER ALBUM -->
  <div id="albumScreen" class="hidden">

    <div class="topbar">

      <div class="title">
        MOtki 🫀 Ghaltu
      </div>

      <button class="menu" onclick="lockEverything()">
        ⋮
      </button>

    </div>

    <div id="gallery" class="gallery"></div>

  </div>


  <!-- OWNER LOGIN -->
  <div id="ownerScreen" class="hidden card">

    <div class="title">
      👑 Owner Login
    </div>

    <input
      id="ownerEmail"
      type="email"
      value="bishalff211@gmail.com"
      readonly
    >

    <input
      id="ownerPassword"
      type="password"
      placeholder="Owner password"
    >

    <button onclick="ownerLogin()">
      Owner Login
    </button>

    <button onclick="backToUser()">
      Back
    </button>

    <div id="ownerStatus" class="status"></div>

  </div>


  <!-- OWNER PANEL -->
  <div id="ownerPanel" class="hidden">

    <div class="topbar">

      <div class="title">
        👑 Owner Panel
      </div>

      <button class="menu" onclick="lockEverything()">
        ⋮
      </button>

    </div>

    <div class="card">

      <input
        id="fileInput"
        type="file"
        accept="image/*"
      >

      <button onclick="uploadPhoto()">
        📤 Upload Photo
      </button>

      <div id="uploadStatus" class="status"></div>

    </div>

    <div id="ownerGallery" class="gallery"></div>

  </div>

</div>


<script>

/* =========================
   SUPABASE SETTINGS
========================= */

const SUPABASE_URL =
"https://dytkmhisobvhyzzqsbjj.supabase.co";

const SUPABASE_KEY =
"YOUR_PUBLISHABLE_KEY";

const BUCKET =
"MOtki Ghaltu";

const OWNER_EMAIL =
"bishalff211@gmail.com";

const USER_PASSWORD =
"sabbis26";


/* =========================
   BASIC HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function status(id,text){
  $(id).textContent = text;
}


/* =========================
   USER LOGIN
========================= */

function userLogin(){

  const password =
    $("userPassword").value;

  if(password !== USER_PASSWORD){

    status(
      "userStatus",
      "Wrong password"
    );

    return;
  }

  $("loginScreen")
    .classList.add("hidden");

  $("albumScreen")
    .classList.remove("hidden");

  loadUserGallery();
}


/* =========================
   3 TAP OWNER
========================= */

let tapCount = 0;
let tapTimer = null;

$("secretTitle").addEventListener(
  "click",
  function(){

    tapCount++;

    clearTimeout(tapTimer);

    tapTimer = setTimeout(
      function(){
        tapCount = 0;
      },
      800
    );

    if(tapCount === 3){

      tapCount = 0;

      $("loginScreen")
        .classList.add("hidden");

      $("ownerScreen")
        .classList.remove("hidden");

      $("ownerPassword").value = "";
      $("ownerStatus").textContent = "";
    }

  }
);


/* =========================
   OWNER LOGIN
========================= */

async function ownerLogin(){

  const email =
    OWNER_EMAIL;

  const password =
    $("ownerPassword").value;

  if(!password){

    status(
      "ownerStatus",
      "Enter password"
    );

    return;
  }

  status(
    "ownerStatus",
    "Checking..."
  );

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY
          },

          body:JSON.stringify({
            email:email,
            password:password
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      status(
        "ownerStatus",
        "Wrong owner password"
      );

      return;
    }

    localStorage.setItem(
      "owner_access_token",
      data.access_token
    );

    localStorage.setItem(
      "owner_refresh_token",
      data.refresh_token
    );

    $("ownerScreen")
      .classList.add("hidden");

    $("ownerPanel")
      .classList.remove("hidden");

    loadOwnerGallery();

  }catch(error){

    status(
      "ownerStatus",
      "Connection error"
    );
  }
}


/* =========================
   GET OWNER TOKEN
========================= */

function ownerToken(){

  return localStorage.getItem(
    "owner_access_token"
  );
}


/* =========================
   USER GALLERY
========================= */

async function loadUserGallery(){

  const response =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/list/" +
      encodeURIComponent(BUCKET),
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          prefix:"",
          limit:100,
          offset:0
        })
      }
    );

  if(!response.ok){

    status(
      "userStatus",
      "Could not load photos"
    );

    return;
  }

  const files =
    await response.json();

  renderGallery(
    files,
    "gallery",
    false
  );
}


/* =========================
   OWNER GALLERY
========================= */

async function loadOwnerGallery(){

  const token =
    ownerToken();

  if(!token)return;

  const response =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/list/" +
      encodeURIComponent(BUCKET),
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
            "Bearer " + token,

          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          prefix:"",
          limit:100,
          offset:0
        })
      }
    );

  if(!response.ok){

    status(
      "uploadStatus",
      "Could not load photos"
    );

    return;
  }

  const files =
    await response.json();

  renderGallery(
    files,
    "ownerGallery",
    true
  );
}


/* =========================
   PHOTO URL
========================= */

function photoURL(name){

  return SUPABASE_URL +
    "/storage/v1/object/public/" +
    encodeURIComponent(BUCKET) +
    "/" +
    encodeURIComponent(name);
}


/* =========================
   RENDER PHOTOS
========================= */

function renderGallery(
  files,
  target,
  owner
){

  const box =
    $(target);

  box.innerHTML = "";

  files
    .filter(file => file.name)
    .forEach(file => {

      const url =
        photoURL(file.name);

      const item =
        document.createElement("div");

      item.className =
        "photo";

      const img =
        document.createElement("img");

      img.src = url;
      img.loading = "lazy";

      const buttons =
        document.createElement("div");

      buttons.className =
        "photo-buttons";


      /* DOWNLOAD */

      const download =
        document.createElement("button");

      download.textContent =
        "⬇️ Download";

      download.className =
        "download";

      download.onclick =
        function(){

          downloadPhoto(
            url,
            file.name
          );

        };


      buttons.appendChild(
        download
      );


      /* OWNER DELETE */

      if(owner){

        const del =
          document.createElement("button");

        del.textContent =
          "🗑️ Delete";

        del.className =
          "delete";

        del.onclick =
          function(){

            deletePhoto(
              file.name
            );

          };

        buttons.appendChild(
          del
        );
      }


      item.appendChild(img);

      item.appendChild(
        buttons
      );

      box.appendChild(item);

    });
}


/* =========================
   DOWNLOAD
========================= */

async function downloadPhoto(
  url,
  name
){

  try{

    const response =
      await fetch(url);

    const blob =
      await response.blob();

    const link =
      document.createElement("a");

    link.href =
      URL.createObjectURL(blob);

    link.download =
      name;

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(
      link.href
    );

  }catch(error){

    window.open(
      url,
      "_blank"
    );
  }
}


/* =========================
   OWNER UPLOAD
========================= */

async function uploadPhoto(){

  const file =
    $("fileInput").files[0];

  if(!file){

    status(
      "uploadStatus",
      "Choose a photo first"
    );

    return;
  }

  const token =
    ownerToken();

  if(!token){

    status(
      "uploadStatus",
      "Owner login required"
    );

    return;
  }

  const filename =
    Date.now() +
    "_" +
    file.name.replace(
      /\s+/g,
      "_"
    );

  status(
    "uploadStatus",
    "Uploading..."
  );

  const response =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/" +
      encodeURIComponent(BUCKET) +
      "/" +
      encodeURIComponent(filename),
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
            "Bearer " + token,

          "Content-Type":
            file.type ||
            "application/octet-stream"
        },

        body:file
      }
    );

  if(response.ok){

    $("fileInput").value = "";

    status(
      "uploadStatus",
      "Uploaded successfully"
    );

    loadOwnerGallery();

  }else{

    const data =
      await response
        .json()
        .catch(
          () => ({})
        );

    status(
      "uploadStatus",
      data.message ||
      "Upload failed"
    );
  }
}


/* =========================
   OWNER DELETE
========================= */

async function deletePhoto(
  filename
){

  const token =
    ownerToken();

  if(!token){

    alert(
      "Owner login required"
    );

    return;
  }

  if(!confirm(
    "Delete this photo?"
  ))return;

  const response =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/" +
      encodeURIComponent(BUCKET),
      {
        method:"DELETE",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
            "Bearer " + token,

          "Content-Type":
            "application/json"
        },

        body:JSON.stringify([
          filename
        ])
      }
    );

  if(response.ok){

    loadOwnerGallery();

  }else{

    alert(
      "Delete failed"
    );
  }
}


/* =========================
   BACK TO USER
========================= */

function backToUser(){

  $("ownerScreen")
    .classList.add("hidden");

  $("loginScreen")
    .classList.remove("hidden");

  $("ownerPassword").value = "";
}


/* =========================
   LOCK EVERYTHING
========================= */

function lockEverything(){

  localStorage.removeItem(
    "owner_access_token"
  );

  localStorage.removeItem(
    "owner_refresh_token"
  );

  $("albumScreen")
    .classList.add("hidden");

  $("ownerPanel")
    .classList.add("hidden");

  $("ownerScreen")
    .classList.add("hidden");

  $("loginScreen")
    .classList.remove("hidden");

  $("userPassword").value = "";
  $("ownerPassword").value = "";
}

</script>

</body>
</html>
