<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Love ❤️</title>
    <style>
        body {
            background-color: #ffe4e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: white;
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
            border: 2px solid #ffafcc;
            z-index: 10;
        }
        h1 { color: #d63384; font-size: 2.5em; }
        .nickname { font-size: 2em; color: #ff4d6d; font-weight: bold; }
        .emoji-rain { font-size: 2em; margin-top: 20px; }
        .heart { font-size: 80px; animation: beat 1s infinite; }
        @keyframes beat { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>Happy Birthday!</h1>
        <p>मेरो प्यारो</p>
        <div id="nicknames" class="nickname">Loading...</div>
        <div class="emoji-rain">🥰✨🎂🎉💖💕💗😍🎈🎁🎊🌹💘🍭🎀</div>
    </div>

    <script>
        const names = ["Motki", "Musarni", "Sabbu", "Churelbi"];
        let i = 0;
        const display = document.getElementById('nicknames');
        
        setInterval(() => {
            display.innerText = names[i];
            i = (i + 1) % names.length;
        }, 2000); // हरेक २ सेकेन्डमा नाम फेरिनेछ
    </script>

</body>
</html>
