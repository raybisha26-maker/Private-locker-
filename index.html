<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MOtki 🫀 Ghaltu 💕</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 15% 15%,#ff4f9a55,transparent 30%),
        radial-gradient(circle at 85% 20%,#ff174455,transparent 28%),
        radial-gradient(circle at 50% 90%,#a000ff55,transparent 35%),
        linear-gradient(145deg,#16000e,#35001f,#09000d);
}

button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.love-bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.love-bg span{
    position:absolute;
    font-size:30px;
    opacity:.22;
    animation:loveFloat linear infinite;
}

.love-bg span:nth-child(1){left:5%;animation-duration:10s}
.love-bg span:nth-child(2){left:18%;animation-duration:13s;animation-delay:2s}
.love-bg span:nth-child(3){left:32%;animation-duration:11s;animation-delay:4s}
.love-bg span:nth-child(4){left:48%;animation-duration:15s;animation-delay:1s}
.love-bg span:nth-child(5){left:64%;animation-duration:12s;animation-delay:5s}
.love-bg span:nth-child(6){left:78%;animation-duration:14s;animation-delay:3s}
.love-bg span:nth-child(7){left:91%;animation-duration:10s;animation-delay:6s}

@keyframes loveFloat{
    0%{transform:translateY(110vh) rotate(0deg) scale(.7)}
    50%{transform:translateY(45vh) rotate(180deg) scale(1)}
    100%{transform:translateY(-120px) rotate(360deg) scale(.8)}
}

.wrap{
    max-width:480px;
    margin:auto;
    padding:22px 18px 40px;
}

.title{
    text-align:center;
    font-size:29px;
    font-weight:bold;
    margin:12px 0;
    user-select:none;
    text-shadow:0 0 10px #ff4f9a,0 0 25px #ff1744;
}

.subtitle{
    text-align:center;
    opacity:.8;
    margin-bottom:24px;
}

.card{
    background:#ffffff12;
    border:1px solid #ffffff25;
    border-radius:24px;
    padding:20px;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 10px 40px #00000055,inset 0 0 20px #ffffff05;
}

input,button{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:0;
    border-radius:14px;
}

input{
    background:#ffffff14;
    color:white;
    border:1px solid #ffffff30;
    outline:none;
}

input:focus{
    border-color:#ff5b9d;
    box-shadow:0 0 12px #ff2f7d55;
}

input::placeholder{color:#ffffff90}

button{
    background:linear-gradient(135deg,#fff,#ffd6e8);
    color:#280014;
    font-weight:bold;
    box-shadow:0 5px 18px #ff3d8d33;
    transition:.2s;
}

button:active{transform:scale(.97)}

.status{
    text-align:center;
    min-height:20px;
    margin:10px 0;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.topbar .title{flex:1}

.menu{
    width:46px;
    padding:8px;
    background:#ffffff18;
    color:white;
    font-size:25px;
    box-shadow:none;
}

.love-line{
    text-align:center;
    font-size:24px;
    letter-spacing:5px;
    margin:8px 0 18px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:20px;
}

.photo{
    background:#ffffff10;
    border:1px solid #ffffff22;
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 8px 25px #00000040;
}

.photo img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.photo-buttons{
    display:flex;
    gap:5px;
    padding:7px;
}

.photo-buttons button{
    margin:0;
    padding:10px 4px;
    font-size:12px;
}

.download{
    background:#9b4dff;
    color:white;
}

.delete{
    background:#ff3d67;
    color:white;
}

.love-message{
    text-align:center;
    margin:22px 0 5px;
    font-size:14px;
    opacity:.75;
}

.love-message b{color:#ff83b8}

.owner-badge{
    text-align:center;
    font-size:40px;
    margin-bottom:5px;
}

.owner-info{
    text-align:center;
    opacity:.7;
    font-size:13px;
    margin-bottom:15px;
}

@media(max-width:380px){
    .title{font-size:25px}
    .gallery{gap:9px}
}
</style>
</head>

<body>

<div class="love-bg">
    <span>❤️</span>
    <span>💖</span>
    <span>💋</span>
    <span>🫀</span>
    <span>😘</span>
    <span>🥰</span>
    <span>🌹</span>
</div>

<div id="app" class="wrap">

<!-- USER LOGIN -->

<div id="loginScreen" class="card">

    <div id="secretTitle" class="title">
        MOtki 🫀 Ghaltu 💕
    </div>

    <div class="love-line">
        ❤️ 💋 🥰 💞 🫀
    </div>

    <div class="subtitle">
        Our Little Private Album 🌹✨
    </div>

    <input
        id="userPassword"
        type="password"
        placeholder="🔐 Enter password"
    >

    <button onclick="userLogin()">
        💕 Open Love Album 💕
    </button>

    <div id="userStatus" class="status"></div>

    <div class="love-message">
        Made with ❤️ for <b>lovers</b> 💋
    </div>

</div>


<!-- USER ALBUM -->

<div id="albumScreen" class="hidden">

    <div class="topbar">

        <div class="title">
            MOtki 🫀 Ghaltu 💕
        </div>

        <button class="menu" onclick="lockEverything()">
            ⋮
        </button>

    </div>

    <div class="love-line">
        🥰 ❤️ 💋 🫀 💖 🌹
    </div>

    <div id="gallery" class="gallery"></div>

    <div class="love-message">
        Every picture has a little piece of our ❤️
    </div>

</div>


<!-- OWNER LOGIN -->

<div id="ownerScreen" class="hidden card">

    <div class="owner-badge">👑</div>

    <div class="title">
        Owner Login 💕
    </div>

    <div class="owner-info">
        Only the owner can manage this album 🔐
    </div>

    <input
        id="ownerEmail"
        type="email"
        value="bishalff211@gmail.com"
        readonly
    >

    <input
        id="ownerPassword"
        type="password"
        placeholder="👑 Owner password"
    >

    <button onclick="ownerLogin()">
        👑 Enter Owner Panel
    </button>

    <button onclick="backToUser()">
        ❤️ Back
    </button>

    <div id="ownerStatus" class="status"></div>

</div>


<!-- OWNER PANEL -->

<div id="ownerPanel" class="hidden">

    <div class="topbar">

        <div class="title">
            👑 Owner Panel 💕
        </div>

        <button class="menu" onclick="lockEverything()">
            ⋮
        </button>

    </div>

    <div class="love-line">
        👑 ❤️ 🫀 💋 🌹
    </div>

    <div class="card">

        <input
            id="fileInput"
            type="file"
            accept="image/*"
        >

        <button onclick="uploadPhoto()">
            📥 Upload Photo ❤️
        </button>

        <div id="uploadStatus" class="status"></div>

    </div>

    <div id="ownerGallery" class="gallery"></div>

</div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ============================
   SUPABASE
============================ */

const SUPABASE_URL =
"https://dytkmhisobvhyzzqsbjj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_N5eq4Lw46JsYULH2tA-Cbw_SOiCzGvV";

const BUCKET =
"MOtki Ghaltu";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ============================
   PASSWORDS
============================ */

const OWNER_EMAIL =
"bishalff211@gmail.com";

const USER_PASSWORD =
"sabbis26";

const OWNER_PASSWORD =
"sabbis26";


/* ============================
   HELPERS
============================ */

function $(id){
    return document.getElementById(id);
}

function status(id,text){
    $(id).textContent = text;
}


/* ============================
   USER LOGIN
============================ */

function userLogin(){

    const password =
        $("userPassword").value;

    if(password !== USER_PASSWORD){

        status(
            "userStatus",
            "❌ Wrong password 💔"
        );

        return;
    }

    $("loginScreen")
        .classList.add("hidden");

    $("albumScreen")
        .classList.remove("hidden");

    loadUserGallery();
}


/* ============================
   3 TAP OWNER
============================ */

let tapCount = 0;
let tapTimer = null;

$("secretTitle")
.addEventListener("click",function(){

    tapCount++;

    clearTimeout(tapTimer);

    tapTimer = setTimeout(function(){
        tapCount = 0;
    },800);

    if(tapCount === 3){

        tapCount = 0;

        $("loginScreen")
            .classList.add("hidden");

        $("ownerScreen")
            .classList.remove("hidden");

        $("ownerPassword").value = "";

        $("ownerStatus").textContent = "";
    }
});


/* ============================
   OWNER LOGIN
============================ */

async function ownerLogin(){

    const password =
        $("ownerPassword").value;

    if(!password){

        status(
            "ownerStatus",
            "🔐 Enter owner password"
        );

        return;
    }

    if(password !== OWNER_PASSWORD){

        status(
            "ownerStatus",
            "❌ Wrong owner password 💔"
        );

        return;
    }

    $("ownerScreen")
        .classList.add("hidden");

    $("ownerPanel")
        .classList.remove("hidden");

    loadOwnerGallery();
}


/* ============================
   BACK
============================ */

function backToUser(){

    $("ownerScreen")
        .classList.add("hidden");

    $("loginScreen")
        .classList.remove("hidden");

    $("ownerPassword").value = "";

    $("ownerStatus").textContent = "";
}


/* ============================
   LOCK
============================ */

function lockEverything(){

    $("albumScreen")
        .classList.add("hidden");

    $("ownerPanel")
        .classList.add("hidden");

    $("ownerScreen")
        .classList.add("hidden");

    $("loginScreen")
        .classList.remove("hidden");

    $("userPassword").value = "";
    $("ownerPassword").value = "";
}


/* ============================
   UPLOAD PHOTO
============================ */

async function uploadPhoto(){

    const file =
        $("fileInput").files[0];

    if(!file){

        status(
            "uploadStatus",
            "📸 पहिले photo select गर ❤️"
        );

        return;
    }

    status(
        "uploadStatus",
        "⏳ Upload हुँदैछ... 💕"
    );

    const safeName =
        file.name
        .replace(/[^a-zA-Z0-9._-]/g,"_");

    const filePath =
        Date.now() + "_" + safeName;

    const {error} =
        await supabaseClient
        .storage
        .from(BUCKET)
        .upload(
            filePath,
            file
        );

    if(error){

        status(
            "uploadStatus",
            "❌ Upload failed: " + error.message
        );

        return;
    }

    status(
        "uploadStatus",
        "❤️ Photo uploaded successfully!"
    );

    $("fileInput").value = "";

    loadOwnerGallery();
}


/* ============================
   LOAD USER GALLERY
============================ */

async function loadUserGallery(){

    const gallery =
        $("gallery");

    gallery.innerHTML =
        "<p>⏳ Loading photos... ❤️</p>";

    const {data,error} =
        await supabaseClient
        .storage
        .from(BUCKET)
        .list("",{
            limit:100,
            sort:{
                column:"created_at",
                order:"desc"
            }
        });

    if(error){

        gallery.innerHTML =
            "<p>❌ " +
            error.message +
            "</p>";

        return;
    }

    gallery.innerHTML = "";

    data.forEach(file => {

        if(!file.name) return;

        const {data:urlData} =
            supabaseClient
            .storage
            .from(BUCKET)
            .getPublicUrl(file.name);

        const box =
            document.createElement("div");

        box.className = "photo";

        box.innerHTML = `
            <img src="${urlData.publicUrl}" loading="lazy">

            <div class="photo-buttons">

                <button
                    class="download"
                    onclick="downloadPhoto('${file.name}')">
                    📥 Save
                </button>

            </div>
        `;

        gallery.appendChild(box);
    });
}


/* ============================
   OWNER GALLERY
============================ */

async function loadOwnerGallery(){

    const gallery =
        $("ownerGallery");

    gallery.innerHTML =
        "<p>⏳ Loading... 👑</p>";

    const {data,error} =
        await supabaseClient
        .storage
        .from(BUCKET)
        .list("",{
            limit:100,
            sort:{
                column:"created_at",
                order:"desc"
            }
        });

    if(error){

        gallery.innerHTML =
            "<p>❌ " +
            error.message +
            "</p>";

        return;
    }

    gallery.innerHTML = "";

    data.forEach(file => {

        if(!file.name) return;

        const {data:urlData} =
            supabaseClient
            .storage
            .from(BUCKET)
            .getPublicUrl(file.name);

        const box =
            document.createElement("div");

        box.className = "photo";

        box.innerHTML = `
            <img src="${urlData.publicUrl}" loading="lazy">

            <div class="photo-buttons">

                <button
                    class="download"
                    onclick="downloadPhoto('${file.name}')">
                    📥 Save
                </button>

                <button
                    class="delete"
                    onclick="deletePhoto('${file.name}')">
                    🗑️ Delete
                </button>

            </div>
        `;

        gallery.appendChild(box);
    });
}


/* ============================
   DOWNLOAD
============================ */

async function downloadPhoto(fileName){

    const {data} =
        supabaseClient
        .storage
        .from(BUCKET)
        .getPublicUrl(fileName);

    const a =
        document.createElement("a");

    a.href =
        data.publicUrl;

    a.download =
        fileName;

    a.target = "_blank";

    document.body.appendChild(a);

    a.click();

    a.remove();
}


/* ============================
   DELETE
============================ */

async function deletePhoto(fileName){

    if(!confirm(
        "यो photo delete गर्ने हो? 🥺"
    )){
        return;
    }

    const {error} =
        await supabaseClient
        .storage
        .from(BUCKET)
        .remove([fileName]);

    if(error){

        alert(
            "❌ Delete failed: " +
            error.message
        );

        return;
    }

    loadOwnerGallery();
}

</script>

</body>
    </html>
