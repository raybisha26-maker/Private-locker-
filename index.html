<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kue Re Madharchod</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .photo-box {
      position: relative;
      width: 100%;
      max-width: 650px;
    }

    .photo-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    .text {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;

      color: #ffd83d;
      font-size: clamp(30px, 8vw, 65px);
      font-weight: bold;

      text-shadow:
        2px 2px 3px #000,
        -2px -2px 3px #000,
        2px -2px 3px #000,
        -2px 2px 3px #000;
    }
  </style>
</head>

<body>

  <div class="photo-box">

    <!-- तिम्रो फोटो -->
    <img src="photo.jpg" alt="Photo">

    <!-- माथिको Text -->
    <div class="text">
      Kue Re Madharchod
    </div>

  </div>

</body>
</html>
