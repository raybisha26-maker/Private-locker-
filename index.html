<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOtki 🫀 Ghaltu 💕</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    overflow-x:hidden;

    background:
    radial-gradient(circle at 10% 10%,#ff4f9a66,transparent 30%),
    radial-gradient(circle at 90% 20%,#ff174466,transparent 30%),
    radial-gradient(circle at 50% 90%,#a000ff55,transparent 35%),
    linear-gradient(145deg,#12000c,#36001f,#09000d);
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

.wrap{
    width:100%;
    max-width:480px;
    margin:auto;
    padding:22px 17px 45px;
}

/* FLOATING LOVE EMOJIS */

.love-bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.love-bg span{
    position:absolute;
    bottom:-80px;
    font-size:30px;
    opacity:.25;
    animation:floatLove 10s linear infinite;
}

.love-bg span:nth-child(1){left:4%;animation-duration:10s}
.love-bg span:nth-child(2){left:17%;animation-duration:13s;animation-delay:2s}
.love-bg span:nth-child(3){left:30%;animation-duration:11s;animation-delay:4s}
.love-bg span:nth-child(4){left:44%;animation-duration:14s;animation-delay:1s}
.love-bg span:nth-child(5){left:58%;animation-duration:12s;animation-delay:5s}
.love-bg span:nth-child(6){left:72%;animation-duration:15s;animation-delay:3s}
.love-bg span:nth-child(7){left:87%;animation-duration:10s;animation-delay:6s}

@keyframes floatLove{
    0%{
        transform:translateY(0) rotate(0deg);
    }

    100%{
        transform:translateY(-115vh) rotate(360deg);
    }
}

/* CARD */

.card{
    padding:21px;
    border-radius:24px;

    background:#ffffff12;
    border:1px solid #ffffff25;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    box-shadow:
    0 15px 45px #00000055,
    inset 0 0 25px #ffffff05;
}

/* TITLE */

.title{
    text-align:center;
    font-size:29px;
    font-weight:bold;
    margin:12px 0;

    user-select:none;

    text-shadow:
    0 0 10px #ff4f9a,
    0 0 25px #ff1744;
}

.subtitle{
    text-align:center;
    opacity:.75;
    margin-bottom:22px;
}

.love-line{
    text-align:center;
    font-size:23px;
    letter-spacing:4px;
    margin:8px 0 18px;
}

/* INPUT */

input{
    width:100%;
    padding:14px;
    margin:7px 0;

    border-radius:14px;
    border:1px solid #ffffff30;

    background:#ffffff14;
    color:white;
    outline:none;
}

input:focus{
    border-color:#ff579b;
    box-shadow:0 0 15px #ff3d8d44;
}

input::placeholder{
    color:#ffffff88;
}

/* BUTTON */

button{
    width:100%;
    padding:14px;
    margin:7px 0;

    border:0;
    border-radius:14px;

    background:linear-gradient(
        135deg,
        #ffffff,
        #ffd4e7
    );

    color:#280014;
    font-weight:bold;

    box-shadow:0 5px 18px #ff3d8d33;

    transition:.2s;
}

button:active{
    transform:scale(.97);
}

/* STATUS */

.status{
    min-height:20px;
    text-align:center;
    margin:10px 0;
}

/* TOP BAR */

.topbar{
    display:flex;
    align-items:center;
    gap:10px;
}

.topbar .title{
    flex:1;
}

.menu{
    width:46px;
    padding:8px;

    background:#ffffff18;
    color:white;

    font-size:25px;
    box-shadow:none;
}

/* GALLERY */

.gallery{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:20px;
}

.photo{
    overflow:hidden;

    border-radius:17px;
    border:1px solid #ffffff22;

    background:#ffffff10;

    box-shadow:
    0 8px 25px #00000045;
}

.photo img{
    display:block;
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
}

.photo-buttons{
    display:flex;
    gap:5px;
    padding:7px;
}

.photo-buttons button{
    margin:0;
    padding:10px 4px;
    font-size:12px;
}

.download{
    background:#8d4dff;
    color:white;
}

.delete{
    background:#ff3d67;
    color:white;
}

/* OWNER */

.owner-icon{
    text-align:center;
    font-size:43px;
}

.owner-info{
    text-align:center;
    opacity:.7;
    font-size:13px;
    margin-bottom:15px;
}

.love-message{
    text-align:center;
    margin-top:22px;
    opacity:.7;
    font-size:14px;
}

@media(max-width:380px){

    .title{
        font-size:25px;
    }

    .gallery{
        gap:9px;
    }
}
</style>
</head>


<body>

<!-- LOVE WALLPAPER -->

<div class="love-bg">

    <span>❤️</span>
    <span>💖</span>
    <span>💋</span>
    <span>🫀</span>
    <span>😘</span>
    <span>🥰</span>
    <span>🌹</span>

</div>


<div class="wrap">


<!-- ================= USER LOGIN ================= -->

<div id="loginScreen" class="card">

    <div
        id="secretTitle"
        class="title">

        MOtki 🫀 Ghaltu 💕

    </div>

    <div class="love-line">
        ❤️ 💋 🥰 💞 🫀 💖 🌹
    </div>

    <div class="subtitle">
        Our Private Love Album ✨
    </div>

    <input
        id="userPassword"
        type="password"
        placeholder="🔐 Enter password"
    >

    <button onclick="userLogin()">
        💕 Open Album 💕
    </button>

    <div
        id="userStatus"
        class="status">
    </div>

    <div class="love-message">
        Made with ❤️ for lovers 💋🥰
    </div>

</div>


<!-- ================= USER ALBUM ================= -->

<div
    id="albumScreen"
    class="hidden">

    <div class="topbar">

        <div class="title">
            MOtki 🫀 Ghaltu 💕
        </div>

        <button
            class="menu"
            onclick="lockEverything()">

            ⋮

        </button>

    </div>

    <div class="love-line">
        🥰 ❤️ 💋 🫀 💖 🌹 💞
    </div>

    <div
        id="gallery"
        class="gallery">
    </div>

    <div class="love-message">
        Every photo has a little ❤️
    </div>

</div>


<!-- ================= OWNER LOGIN ================= -->

<div
    id="ownerScreen"
    class="hidden card">

    <div class="owner-icon">
        👑
    </div>

    <div class="title">
        Owner Login 💕
    </div>

    <div class="owner-info">
        Only owner can manage photos 🔐
    </div>

    <input
        id="ownerEmail"
        type="email"
        value="bishalff211@gmail.com"
        readonly
    >

    <input
        id="ownerPassword"
        type="password"
        placeholder="👑 Owner password"
    >

    <button onclick="ownerLogin()">
        👑 Enter Owner Panel
    </button>

    <button onclick="backToUser()">
        ❤️ Back
    </button>

    <div
        id="ownerStatus"
        class="status">
    </div>

</div>


<!-- ================= OWNER PANEL ================= -->

<div
    id="ownerPanel"
    class="hidden">

    <div class="topbar">

        <div class="title">
            👑 Owner Panel 💕
        </div>

        <button
            class="menu"
            onclick="lockEverything()">

            ⋮

        </button>

    </div>

    <div class="love-line">
        👑 ❤️ 🫀 💋 🌹 💖
    </div>

    <div class="card">

        <input
            id="fileInput"
            type="file"
            accept="image/*"
        >

        <button onclick="uploadPhoto()">
            📸 Upload Photo ❤️
        </button>

        <div
            id="uploadStatus"
            class="status">
        </div>

    </div>

    <div
        id="ownerGallery"
        class="gallery">
    </div>

</div>


</div>


<!-- SUPABASE LIBRARY -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================
   SUPABASE SETTINGS
===================================== */

const SUPABASE_URL =
"https://dytkmhisobvhyzzqsbjj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_N5eq4Lw46JsYULH2tA-Cbw_SOiCzGvV";


/* ⭐ YOUR EXACT BUCKET NAME ⭐ */

const BUCKET =
"Motki_Ghaltu";


/* =====================================
   PASSWORDS
===================================== */

const USER_PASSWORD =
"sabbis26";

const OWNER_PASSWORD =
"sabbis26";

const OWNER_EMAIL =
"bishalff211@gmail.com";


/* =====================================
   SUPABASE CLIENT
===================================== */

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   HELPER
===================================== */

function $(id){
    return document.getElementById(id);
}

function status(id,text){
    $(id).textContent = text;
}


/* =====================================
   USER LOGIN
===================================== */

function userLogin(){

    const password =
    $("userPassword").value;

    if(password !== USER_PASSWORD){

        status(
            "userStatus",
            "❌ Wrong password 💔"
        );

        return;
    }

    $("loginScreen")
    .classList.add("hidden");

    $("albumScreen")
    .classList.remove("hidden");

    loadUserGallery();
}


/* =====================================
   3 TAP OWNER
===================================== */

let tapCount = 0;
let tapTimer = null;

$("secretTitle")
.addEventListener(
    "click",
    function(){

        tapCount++;

        clearTimeout(tapTimer);

        tapTimer =
        setTimeout(
            function(){
                tapCount = 0;
            },
            800
        );

        if(tapCount === 3){

            tapCount = 0;

            $("loginScreen")
            .classList.add("hidden");

            $("ownerScreen")
            .classList.remove("hidden");

            $("ownerPassword").value = "";

            $("ownerStatus")
            .textContent = "";
        }
    }
);


/* =====================================
   OWNER LOGIN
===================================== */

function ownerLogin(){

    const password =
    $("ownerPassword").value;

    if(password !== OWNER_PASSWORD){

        status(
            "ownerStatus",
            "❌ Wrong owner password 💔"
        );

        return;
    }

    $("ownerScreen")
    .classList.add("hidden");

    $("ownerPanel")
    .classList.remove("hidden");

    loadOwnerGallery();
}


/* =====================================
   BACK
===================================== */

function backToUser(){

    $("ownerScreen")
    .classList.add("hidden");

    $("loginScreen")
    .classList.remove("hidden");

    $("ownerPassword").value = "";

}


/* =====================================
   LOCK
===================================== */

function lockEverything(){

    $("albumScreen")
    .classList.add("hidden");

    $("ownerPanel")
    .classList.add("hidden");

    $("ownerScreen")
    .classList.add("hidden");

    $("loginScreen")
    .classList.remove("hidden");

    $("userPassword").value = "";

    $("ownerPassword").value = "";
}


/* =====================================
   UPLOAD
===================================== */

async function uploadPhoto(){

    const file =
    $("fileInput").files[0];

    if(!file){

        status(
            "uploadStatus",
            "📸 पहिले photo select गर ❤️"
        );

        return;
    }


    status(
        "uploadStatus",
        "⏳ Upload हुँदैछ... 💕"
    );


    const cleanName =
    file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
    );


    const filePath =
    Date.now() + "_" + cleanName;


    const result =
    await supabaseClient
    .storage
    .from(BUCKET)
    .upload(
        filePath,
        file
    );


    if(result.error){

        status(
            "uploadStatus",
            "❌ " +
            result.error.message
        );

        return;
    }


    status(
        "uploadStatus",
        "❤️ Photo uploaded!"
    );


    $("fileInput").value = "";

    loadOwnerGallery();
}


/* =====================================
   USER GALLERY
===================================== */

async function loadUserGallery(){

    const gallery =
    $("gallery");

    gallery.innerHTML =
    "<p>⏳ Loading ❤️</p>";


    const result =
    await supabaseClient
    .storage
    .from(BUCKET)
    .list(
        "",
        {
            limit:100,
            sort:{
                column:"created_at",
                order:"desc"
            }
        }
    );


    if(result.error){

        gallery.innerHTML =
        "<p>❌ " +
        result.error.message +
        "</p>";

        return;
    }


    gallery.innerHTML = "";


    result.data.forEach(
        file => {

            if(!file.name)
            return;


            const publicURL =
            supabaseClient
            .storage
            .from(BUCKET)
            .getPublicUrl(
                file.name
            );


            const box =
            document.createElement("div");

            box.className =
            "photo";


            box.innerHTML = `

                <img
                    src="${publicURL.data.publicUrl}"
                    loading="lazy"
                >

                <div
                    class="photo-buttons">

                    <button
                        class="download"
                        onclick="downloadPhoto('${file.name}')">

                        📥 Save

                    </button>

                </div>
            `;


            gallery.appendChild(box);
        }
    );
}


/* =====================================
   OWNER GALLERY
===================================== */

async function loadOwnerGallery(){

    const gallery =
    $("ownerGallery");

    gallery.innerHTML =
    "<p>⏳ Loading photos 👑</p>";


    const result =
    await supabaseClient
    .storage
    .from(BUCKET)
    .list(
        "",
        {
            limit:100,
            sort:{
                column:"created_at",
                order:"desc"
            }
        }
    );


    if(result.error){

        gallery.innerHTML =
        "<p>❌ " +
        result.error.message +
        "</p>";

        return;
    }


    gallery.innerHTML = "";


    result.data.forEach(
        file => {

            if(!file.name)
            return;


            const publicURL =
            supabaseClient
            .storage
            .from(BUCKET)
            .getPublicUrl(
                file.name
            );


            const box =
            document.createElement("div");

            box.className =
            "photo";


            box.innerHTML = `

                <img
                    src="${publicURL.data.publicUrl}"
                    loading="lazy"
                >

                <div
                    class="photo-buttons">

                    <button
                        class="download"
                        onclick="downloadPhoto('${file.name}')">

                        📥 Save

                    </button>

                    <button
                        class="delete"
                        onclick="deletePhoto('${file.name}')">

                        🗑️ Delete

                    </button>

                </div>
            `;


            gallery.appendChild(box);
        }
    );
}


/* =====================================
   DOWNLOAD
===================================== */

async function downloadPhoto(fileName){

    const result =
    supabaseClient
    .storage
    .from(BUCKET)
    .getPublicUrl(
        fileName
    );


    const link =
    document.createElement("a");

    link.href =
    result.data.publicUrl;

    link.download =
    fileName;

    link.target =
    "_blank";

    document.body.appendChild(link);

    link.click();

    link.remove();
}


/* =====================================
   DELETE
===================================== */

async function deletePhoto(fileName){

    const confirmDelete =
    confirm(
        "यो photo delete गर्ने हो? 🥺"
    );


    if(!confirmDelete)
    return;


    const result =
    await supabaseClient
    .storage
    .from(BUCKET)
    .remove([
        fileName
    ]);


    if(result.error){

        alert(
            "❌ Delete failed: " +
            result.error.message
        );

        return;
    }


    loadOwnerGallery();
}

</script>

</body>
</html>
